apply plugin: 'com.android.application'

android {
    namespace = "com.baesungchul.workreport"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.baesungchul.workreport"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 28
        versionName "3.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ☠️ 이 서명은 '테스트 APK 전용'이다. Play 스토어 출시용 키가 아니다.
          왜 필요한가: GitHub Actions 는 매 실행마다 새 서버에서 빌드하는데,
          안드로이드 기본 디버그 키(~/.android/debug.keystore)가 없으면 그때그때
          '새 키'를 만들어 서명한다. 그러면 빌드마다 서명이 달라져서,
          이미 깔린 테스트 앱 위에 덮어쓸 수 없고 '앱이 설치되지 않았습니다' 가 뜬다.
          (업데이트할 때마다 앱을 지워야 하고, 지우면 EXTERNAL 저장소의 사진이 함께 사라진다
           — 2026-08 사진 1,059장 유실과 같은 경로)
          그래서 고정 키를 저장소에 넣어 서명이 항상 같게 만든다.
          비밀번호가 안드로이드 표준 기본값(android)이라 공개돼도 무방하다 —
          이 키로는 Play 스토어에 올릴 수 없다. */
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /* ★ 2026-08-30 Play 스토어 정식 서명키 설정.
              비밀번호/키 파일 경로는 절대 여기(build.gradle)에 직접 안 적는다 — 이 파일은 깃에 커밋되니까.
              대신 android/keystore.properties (깃에 안 올라감, .gitignore 처리됨) 에서 읽어온다.
              그 파일이 없으면(다른 PC·CI 등) release 서명 설정 자체를 건너뛴다 — 디버그 빌드엔 영향 없음.
              사용법: android/keystore.properties.example 을 참고해서
                      android/keystore.properties 파일을 직접 만들고 실제 값을 채워 넣을 것. */
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            /* ★ 2026-09-04 Play 콘솔 "앱 최적화가 기준점 미만입니다"(난독화 4%) 대응으로 켬.
                  구글이 요구하는 최소 난독화 비율은 25%인데, 꺼져 있으면 코드가 그대로 노출돼
                  이 경고가 뜬다. Capacitor·RevenueCat·Firebase 등은 각자 라이브러리 안에
                  자기 자신을 지키는 규칙(consumer proguard)을 이미 담고 있어서, 여기서는
                  이 앱 자신의 네이티브 플러그인 3개만 proguard-rules.pro 에 안전장치로 추가했다.
                  ⚠️ shrinkResources 는 일부러 켜지 않았다 — 리소스를 이름 문자열로 찾는 코드가
                     있으면 깨질 수 있는데 여기선 확인이 안 됐고, 구글이 지적한 건 코드 난독화지
                     리소스 크기가 아니라서 최소 변경만 했다.
                  ☠️ Play 스토어에 새 버전을 올리기 전에 반드시 실제 서명된 릴리스 빌드
                     (bundleRelease)로 로그인·구독(RevenueCat)·PC 링크·사진 저장·백업폴더
                     기능을 한 번씩 눌러 테스트할 것 — 여기(클라우드 세션)는 안드로이드 SDK가
                     없어 실제 빌드로 검증하지 못했다. */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            signingConfig signingConfigs.debug
            /* ★ 2026-08-30 테스트 APK 를 '별도 앱'으로 깔기 위한 접미사.
               ☠️ 이게 없으면 서명이 달라 기존 앱을 지워야 설치된다.
                  그런데 앱을 지우면 EXTERNAL 저장소의 사진이 함께 사라진다
                  (2026-08 사진 1,059장 유실과 같은 경로). 절대 빼지 말 것. */
            applicationIdSuffix ".debug"
            versionNameSuffix "-test"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
