.cust-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  cursor:pointer;
  user-select:none;
  gap:8px;
}
.cust-toggle:active{background:rgba(77,208,225,.1);}
.cust-toggle-label{
  font-size:13px;
  font-weight:700;
  color:var(--ac);
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  min-width:0;
}
.cust-toggle-title{white-space:nowrap;flex-shrink:0;}
.cust-toggle-info{
  font-size:11px;
  color:var(--tx);
  font-weight:500;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
  flex:1;
}
.cust-toggle-empty{
  font-size:11px;
  color:var(--mu);
  font-weight:400;
}
.cust-toggle-arrow{
  font-size:10px;
  color:var(--mu);
  flex-shrink:0;
}
.cust-content{
  padding:0 12px 12px 12px;
  border-top:1px solid rgba(77,208,225,.15);
}
.cust-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  font-weight:700;
  color:var(--ac);
  margin-top:10px;
  margin-bottom:6px;
}

/* 복사 버튼들 */
.cust-copy-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.cust-copy-btn{
  background:rgba(77,208,225,.12);
  color:var(--ac);
  border:1px dashed var(--ac);
  border-radius:6px;
  padding:6px 10px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  flex:1;
  min-width:140px;
}
.cust-copy-btn:active{transform:scale(.96);background:rgba(77,208,225,.2);}
.cust-save-btn{
  background:var(--ac);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:5px 10px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
}
.cust-save-btn:active{transform:scale(.95);}
.cust-save-btn.disabled,
.cust-save-btn:disabled{
  background:var(--sf3);
  color:var(--mu);
  cursor:not-allowed;
}
.cust-save-status{
  font-size:11px;
  margin-bottom:8px;
  min-height:14px;
  font-weight:600;
}
.cust-hint{
  font-size:10px;
  font-weight:400;
  color:var(--mu);
  margin-left:6px;
}
.cust-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:6px;
}
.cust-inp{
  background:var(--sf2);
  border:1px solid var(--bd);
  border-radius:7px;
  padding:8px 10px;
  color:var(--tx);
  font-family:inherit;
  font-size:13px;
  width:100%;
  box-sizing:border-box;
}
.cust-inp:focus{outline:none;border-color:var(--ac);}
.cust-memo{
  background:var(--sf2);
  border:1px solid var(--bd);
  border-radius:7px;
  padding:8px 10px;
  color:var(--tx);
  font-family:inherit;
  font-size:13px;
  width:100%;
  box-sizing:border-box;
  resize:vertical;
}
.cust-memo:focus{outline:none;border-color:var(--ac);}

@media (max-width:600px){
  .cust-grid{grid-template-columns:1fr;}
}

/* 고객 목록 카드 - 컴팩트 (3줄) */
.cust-card{
  background:var(--sf);
  border:1px solid var(--bd);
  border-radius:9px;
  padding:10px 12px;
  cursor:pointer;
  transition:all .15s;
}
.cust-card:active{background:var(--sf2);}
.cust-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:4px;
}
.cust-card-name{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:700;
  color:var(--tx);
  line-height:1.3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.cust-card-actions{
  display:flex;
  gap:5px;
  flex-shrink:0;
}
.cust-card-btn{
  background:var(--sf2);
  border:1px solid var(--bd);
  border-radius:7px;
  min-width:42px;
  height:38px;
  padding:0 8px;
  cursor:pointer;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  flex-shrink:0;
  color:var(--tx);
}
.cust-card-btn:active{transform:scale(.92);}
.cust-card-btn .btn-ic{font-size:14px;line-height:1;}
.cust-card-btn .btn-tx{font-size:11px;font-weight:600;line-height:1;}
/* ★ 2026-08-08 스케줄 목록 카드 버튼: 가져오기가 늘면서 가로로 비좁아짐.
   글자크기 '더 크게'(4)·'아주 크게'(5)에서는 아이콘을 위, 글자를 아래로 쌓는다. */
body[data-fs="4"] .cust-card-btn,
body[data-fs="5"] .cust-card-btn{
  flex-direction:column;
  gap:2px;
  height:auto;
  min-height:46px;
  min-width:38px;
  padding:5px 4px;
}
body[data-fs="4"] .cust-card-btn .btn-tx,
body[data-fs="5"] .cust-card-btn .btn-tx{font-size:10px;letter-spacing:-0.4px;}
body[data-fs="4"] .cust-card-actions,
body[data-fs="5"] .cust-card-actions{gap:4px;}

/* 공용시설 카드 - 보라색 톤으로 구분 */
.cust-card-facility{
  border-left:3px solid #a78bfa;
  background:linear-gradient(to right, rgba(167,139,250,.05), var(--sf));
}

/* 헤더 작업 기록 버튼 */
.hdr-icon-btn .btn-ic{font-size:14px;line-height:1;}
.hdr-icon-btn .btn-tx{font-size:10px;font-weight:600;line-height:1;margin-left:2px;}
.cust-card-line{
  font-size:12px;
  color:var(--tx);
  line-height:1.5;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
/* ★ 호수 + 전화번호 한 줄 */
.cust-card-unitphone{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  font-size:13px;
}
.cust-card-unitphone .cust-unit{
  color:var(--tx);
  font-weight:600;
}
.cust-card-unitphone .cust-phone{
  color:var(--ac2);
  font-weight:600;
}
.cust-card-meta{
  color:var(--mu);
  font-size:11px;
  display:flex;
  gap:6px;
  flex-wrap:nowrap;
  overflow:hidden;
}
.cust-card-memo{
  color:var(--mu);
  overflow:hidden;
  text-overflow:ellipsis;
}
/* 작업 카드 (전화번호 없는 작업) - 살짝 회색 */
.cust-card-work{
  background:var(--sf2);
  border-color:var(--bd);
  opacity:.92;
}
.cust-card-work .cust-card-name{
  color:var(--mu);
  font-weight:600;
}

/* ═══════════════════════════════════════════════
   온보딩 (첫 실행 가이드)
═══════════════════════════════════════════════ */
.ob-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:600;
  align-items:center;justify-content:center;
  padding:16px;
}
.ob-modal.open{display:flex;}
.ob-box{
  background:var(--sf);
  border-radius:18px;
  width:100%;max-width:560px;
  max-height:90vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
/* 진행 바 */
.ob-progress{
  height:4px;background:var(--sf3);
  position:relative;flex-shrink:0;
}
.ob-progress-bar{
  height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));
  width:20%;transition:width .3s ease;
}
.ob-step-counter{
  position:absolute;top:12px;left:18px;
  font-size:12px;color:var(--mu);font-weight:700;
}
.ob-skip{
  position:absolute;top:8px;right:8px;
  background:transparent;border:none;color:var(--mu);
  font-size:12px;cursor:pointer;padding:6px 10px;
  border-radius:6px;
}
.ob-skip:active{background:var(--sf3);}

.ob-content{
  flex:1;overflow-y:auto;
  padding:36px 24px 16px;
}
.ob-step{
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
}
.ob-icon-big{
  font-size:54px;margin-bottom:12px;
}
.ob-title{
  font-size:22px;font-weight:800;
  color:var(--tx);margin:0 0 6px;
  letter-spacing:-.02em;
}
.ob-subtitle{
  font-size:13px;color:var(--mu);
  margin:0 0 20px;line-height:1.5;
}
.ob-hint{
  font-size:12px;color:var(--mu);
  margin:14px 0 0;line-height:1.5;
}

/* 환영 페이지 - 기능 리스트 */

/* ─── 슬라이드 공통 ─── */
.ob-content{flex:1;overflow-y:auto;padding:32px 20px 12px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;}
.ob-slide{display:flex;flex-direction:column;justify-content:flex-start;gap:10px;width:100%;}
.ob-slide > *{flex-shrink:0;}
.ob-slide-ttl{font-size:16px;font-weight:800;color:var(--ac);text-align:center;margin-bottom:2px;}

/* ─── 소개 슬라이드 ─── */
.ob-slide-intro{align-items:center;text-align:center;}
.ob-intro-icon{font-size:52px;margin-bottom:6px;}
.ob-intro-title{font-size:22px;font-weight:800;margin:0 0 4px;}
.ob-intro-sub{font-size:13px;color:var(--mu);margin:0 0 14px;line-height:1.6;}
.ob-intro-feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-bottom:12px;}
.ob-feat{display:flex;align-items:flex-start;gap:8px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left;}
.ob-feat>span{font-size:20px;flex-shrink:0;}
.ob-feat b{font-size:12px;display:block;margin-bottom:1px;}
.ob-feat small{font-size:10px;color:var(--mu);}
.ob-intro-hint{font-size:12px;color:var(--mu);background:var(--sf2);border-radius:8px;padding:8px 12px;}

/* ─── 앱 모형 화면 ─── */
.ob-screen{
  background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;
  padding:8px;font-size:10px;position:relative;overflow:hidden;
}
.obs-hdr{background:var(--sf);border-radius:8px;padding:8px;margin-bottom:6px;}
.obs-logo-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.obs-logo-ic{font-size:16px;}
.obs-logo-txt{font-size:11px;font-weight:800;flex:1;}
.obs-logo-badge{background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:2px 6px;font-size:9px;}
.obs-fields{margin-bottom:5px;}
.obs-field-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:4px;}
.obs-field{display:flex;flex-direction:column;gap:1px;}
.obs-fl{font-size:8px;color:var(--mu);}
.obs-fv{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:3px 5px;font-size:9px;font-weight:600;}
.obs-fv-hl{border-color:var(--ac);color:var(--ac);}
.obs-modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px;}
.obs-mode{padding:5px;text-align:center;border-radius:6px;border:1.5px solid var(--bd);font-size:9px;font-weight:700;}
.obs-mode-on{background:var(--ac);color:#fff;border-color:var(--ac);}
.obs-btns{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
.obs-btn{padding:4px 2px;text-align:center;border-radius:5px;font-size:8px;font-weight:700;cursor:default;border:1px solid transparent;}
.obs-btn-xs{font-size:8px;padding:2px 4px;border-radius:4px;}
.obs-btn-sm{font-size:9px;padding:4px 6px;border-radius:5px;}
.obs-btn-lg{font-size:10px;padding:6px 8px;border-radius:6px;}
.obs-c-gray{background:var(--sf3);border-color:var(--bd);color:var(--tx);}
.obs-c-orange{background:rgba(249,115,22,.15);border-color:#f97316;color:#f97316;}
.obs-c-org2{background:rgba(249,115,22,.15);border-color:#f97316;color:#f97316;}
.obs-c-gold{background:rgba(234,179,8,.15);border-color:#ca8a04;color:#ca8a04;}
.obs-c-blue{background:rgba(61,142,240,.15);border-color:var(--ac);color:var(--ac);}
.obs-c-green{background:rgba(16,185,129,.15);border-color:#10b981;color:#10b981;}
.obs-c-red{background:rgba(240,96,96,.15);border-color:var(--dn);color:var(--dn);}
.obs-c-warn{background:rgba(240,180,0,.15);border-color:#d4a000;color:#d4a000;}

.obs-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px;}
.obs-stat{text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:4px 2px;}
.obs-stat b{display:block;font-size:13px;font-weight:800;color:var(--ac);}
.obs-stat small{font-size:8px;color:var(--mu);}
.obs-stat-warn b{color:#f59e0b;}

/* 호수 추가 */
.obs-add-area{margin-bottom:5px;}
.obs-add-row{display:flex;gap:4px;align-items:center;}
.obs-input-box{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:4px 6px;font-size:10px;}
.obs-card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:4px;overflow:hidden;}
.obs-card-open{border-color:var(--ac);}
.obs-card-top{display:flex;align-items:center;gap:5px;padding:6px 8px;flex-wrap:wrap;}
.obs-card-body{padding:6px 8px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:5px;}
.obs-cnum{width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0;}
.obs-cname{font-size:10px;font-weight:700;flex:1;}
.obs-chip{padding:2px 5px;border-radius:4px;font-size:9px;font-weight:700;flex-shrink:0;}
.obs-chip-done{background:rgba(16,185,129,.15);color:#10b981;}
.obs-chip-pnd{background:rgba(240,180,0,.15);color:#c09000;}
.obs-psec{display:flex;flex-direction:column;gap:3px;}
.obs-plabel{font-size:9px;font-weight:700;}
.obs-thumbs{display:flex;gap:3px;flex-wrap:wrap;}
.obs-th{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.obs-th-f{background:#dde8f5;color:#3d8ef0;}
.obs-th-e{background:var(--sf2);border:1px dashed var(--bd);color:var(--mu);}
.obs-th-lg{width:36px;height:36px;font-size:9px;text-align:center;line-height:1.2;}
.obs-thumbs-lg{flex-direction:column;gap:3px;}
.obs-special{display:flex;align-items:center;gap:6px;font-size:9px;color:#b07000;background:#fffbf0;border-radius:5px;padding:3px 6px;}
.obs-cust-row{display:flex;align-items:center;gap:5px;}

/* 사진 촬영 영역 */
.obs-photo-main{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px;}
.obs-photo-col{display:flex;flex-direction:column;gap:4px;}
.obs-cam-row{display:flex;gap:3px;}

/* 순서편집 */
.obs-reorder-box{background:var(--sf);border:1px solid var(--bd);border-radius:7px;padding:5px 7px;}
.obs-reorder-ttl{font-size:9px;font-weight:700;color:var(--mu);margin-bottom:3px;}
.obs-reorder-item{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--bd);}
.obs-reorder-item:last-child{border-bottom:none;}
.obs-ri-n{width:16px;height:16px;border-radius:50%;background:var(--ac);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.obs-ri-ph{flex:1;height:20px;background:#dde8f5;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;}
.obs-ri-del{color:var(--dn);font-size:10px;cursor:default;}
.obs-ri-handle{color:var(--mu);font-size:14px;font-weight:700;}

/* 저장·기록 */
.obs-save-row{display:flex;gap:5px;margin-bottom:6px;}
.obs-history{background:var(--sf);border:1px solid var(--bd);border-radius:8px;overflow:hidden;}
.obs-hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:10px;}
.obs-filter{display:flex;gap:3px;}
.obs-ftag{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:2px 5px;font-size:8px;}
.obs-ftag-on{background:var(--ac);color:#fff;border-color:var(--ac);}
.obs-hcard{display:flex;align-items:center;gap:5px;padding:5px 8px;border-bottom:1px solid var(--bd);}
.obs-hcard:last-child{border-bottom:none;}
.obs-hcard-apt{font-size:10px;font-weight:700;flex:1;}
.obs-hcard-sub{font-size:8px;color:var(--mu);}

/* 보고서 */
.obs-report{background:var(--sf);border:1.5px solid var(--ac);border-radius:7px;overflow:hidden;}
.obs-rp-hdr{padding:5px 8px;border-bottom:1px solid var(--bd);background:rgba(61,142,240,.05);}
.obs-rp-cover{padding:5px 8px;border-bottom:1px solid var(--bd);}
.obs-rp-cover-ttl{font-size:9px;font-weight:700;margin-bottom:3px;}
.obs-rp-rows{display:flex;flex-direction:column;gap:2px;}
.obs-rp-row{display:flex;align-items:center;gap:5px;font-size:9px;padding:1px 0;}
.obs-rp-n{width:14px;height:14px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0;}
.obs-rp-detail{padding:5px 8px;border-bottom:1px solid var(--bd);}
.obs-rp-unit-bar{font-size:9px;font-weight:700;margin-bottom:4px;}
.obs-rp-photo-cols{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.obs-rp-pcol{display:flex;flex-direction:column;gap:2px;}
.obs-rp-pcol-lbl{font-size:8px;font-weight:700;}
.obs-rp-phs{display:flex;gap:2px;}
.obs-rp-ph{flex:1;aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#666;}
.obs-rp-special{padding:4px 8px;background:#fffbf0;}

/* ─── 번호 뱃지 + 말풍선 ─── */
.obs-badges{position:absolute;inset:0;pointer-events:none;}
.ob-badge{
  position:absolute;
  width:18px;height:18px;border-radius:50%;
  background:var(--dn);color:#fff;
  font-size:10px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;
  pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
  z-index:10;
}
/* 뱃지 위치 자동 배분 */
.obs-badges .ob-badge:nth-child(1){top:8px;left:8px;}
.obs-badges .ob-badge:nth-child(2){top:8px;right:8px;}
.obs-badges .ob-badge:nth-child(3){bottom:8px;left:8px;}
.obs-badges .ob-badge:nth-child(4){bottom:8px;right:8px;}
.obs-badges .ob-badge:nth-child(5){top:50%;left:8px;transform:translateY(-50%);}

.ob-callouts{display:flex;flex-direction:column;gap:5px;}

/* ═══════════════════════════════════════════════
   이미지 기반 슬라이드 (1.221+) - 실제 캡쳐 + 번호 오버레이
═══════════════════════════════════════════════ */
.ob-img-wrap{
  position:relative;
  width:100%;
  border-radius:10px;
  overflow:hidden;
  background:#000;
  border:1.5px solid var(--bd);
}
.ob-img-wrap img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.ob-pin{
  position:absolute;
  width:26px;height:26px;
  border-radius:50%;
  background:var(--ac);
  color:#fff;
  font-weight:800;
  font-size:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.6), 0 0 0 3px rgba(61,142,240,.25);
  transform:translate(-50%, -50%);
  pointer-events:none;
  z-index:2;
}
/* 영역 강조 박스 (반투명, 번호와 페어) */
.ob-zone{
  position:absolute;
  border:2px solid var(--ac);
  border-radius:8px;
  background:rgba(61,142,240,.08);
  pointer-events:none;
  z-index:1;
  box-shadow:0 0 0 2px rgba(0,0,0,.3);
}
.ob-callout{display:flex;align-items:flex-start;gap:8px;background:var(--sf2);border-left:3px solid var(--dn);border-radius:0 8px 8px 0;padding:6px 10px;}
.ob-callout-num{width:18px;height:18px;border-radius:50%;background:var(--dn);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ob-callout-txt{font-size:11px;line-height:1.5;flex:1;}

/* ═══ 애니메이션 온보딩 (스포트라이트 + 손가락) ═══ */
.ob-anim-wrap{
  position:relative;
  width:100%;
  flex-shrink:0;
  border-radius:10px;
  overflow:hidden;
  background:#000;
  border:1.5px solid var(--bd);
  cursor:pointer;
}
.ob-anim-wrap img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
  z-index:0;
}
/* 고정 dim 레이어 - 박스가 움직여도 이 레이어는 안 움직임 → 이미지 흔들림 없음 */
.ob-anim-dim{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.45);
  pointer-events:none;
  z-index:1;
  will-change:clip-path;
  transition:clip-path .45s cubic-bezier(.4,0,.2,1);
}
/* 강조 박스 - 테두리만 (box-shadow 스포트라이트 제거 → 흔들림 해결) */
.ob-hl-box{
  position:absolute;
  border:3px solid var(--ac);
  border-radius:8px;
  background:transparent;
  pointer-events:none;
  z-index:2;
  box-shadow:0 0 0 2px rgba(255,255,255,.5), 0 0 12px 2px rgba(61,142,240,.6);
  transition:top .45s cubic-bezier(.4,0,.2,1), left .45s cubic-bezier(.4,0,.2,1),
             width .45s cubic-bezier(.4,0,.2,1), height .45s cubic-bezier(.4,0,.2,1);
}
.ob-hl-pin{
  position:absolute;
  width:24px;height:24px;
  border-radius:50%;
  background:var(--ac);
  color:#fff;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:3;
  transition:top .5s cubic-bezier(.4,0,.2,1), left .5s cubic-bezier(.4,0,.2,1);
}
.ob-finger{
  position:absolute;
  font-size:28px;
  pointer-events:none;
  z-index:4;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  transition:top .5s cubic-bezier(.4,0,.2,1), left .5s cubic-bezier(.4,0,.2,1);
}
.ob-finger.tap{ animation:obFingerTap 1s ease-in-out infinite; }
@keyframes obFingerTap{
  0%,100%{ transform:translate(-50%,-50%) scale(1); }
  50%{ transform:translate(-50%,-40%) scale(.85); }
}
/* 설명 카드 */
.ob-anim-desc{
  margin-top:12px;
  flex-shrink:0;
  background:var(--sf2);
  border-left:3px solid var(--ac);
  border-radius:0 10px 10px 0;
  padding:12px 14px;
  min-height:88px;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .3s, transform .3s;
}
.ob-anim-desc.show{ opacity:1; transform:translateY(0); }
.ob-anim-desc-title{
  font-size:14px;font-weight:800;color:var(--tx);
  margin-bottom:5px;display:flex;align-items:center;gap:7px;
}
.ob-anim-num{
  width:20px;height:20px;border-radius:50%;
  background:var(--ac);color:#fff;font-size:11px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ob-anim-desc-txt{ font-size:12px;line-height:1.6;color:var(--tx); }
.ob-anim-desc-txt b{ color:var(--ac); }
/* 진행 점 */
.ob-anim-dots{
  display:flex;justify-content:center;gap:8px;margin-top:12px;
}
.ob-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--bd);cursor:pointer;
  transition:all .3s;
}
.ob-dot.on{ background:var(--ac);width:22px;border-radius:4px; }
.ob-anim-hint{
  text-align:center;font-size:11px;color:var(--mu);margin-top:8px;
}

/* ─── 세팅 슬라이드 ─── */
.ob-setup-sub{text-align:center;font-size:12px;color:var(--mu);margin:0 0 10px;line-height:1.5;}
.ob-setup-form{display:flex;flex-direction:column;gap:6px;width:100%;}
.ob-setup-icons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px 0;}
.ob-icon-opt{width:38px;height:38px;border-radius:8px;border:2px solid var(--bd);background:var(--sf2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
.ob-icon-opt.selected{border-color:var(--ac);background:rgba(61,142,240,.1);}
.ob-setup-label{font-size:11px;font-weight:700;color:var(--mu);margin-top:2px;}
.ob-setup-input{background:var(--sf2);border:1.5px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:inherit;font-size:14px;font-weight:600;width:100%;box-sizing:border-box;}
.ob-setup-input:focus{outline:none;border-color:var(--ac);}

/* 푸터 */
.ob-footer{display:flex;gap:8px;padding:10px 20px 16px;border-top:1px solid var(--bd);flex-shrink:0;}

/* ═══════════════════════════════════════════
   하단 탭바 (Bottom Navigation)
═══════════════════════════════════════════ */
.tabbar{
  position:fixed; left:0; right:0; bottom:0;
  display:flex; height:56px;
  background:var(--sf); border-top:1px solid var(--bd);
  z-index:1000;
  padding-bottom:env(safe-area-inset-bottom,0);
  box-shadow:0 -2px 12px rgba(0,0,0,.25);
}
.tab-item{
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;
  background:none; border:none; cursor:pointer;
  color:var(--mu); font-size:11px; font-weight:600;
  padding:6px 0; transition:color .15s;
  -webkit-tap-highlight-color:transparent;
}
.tab-item .tab-ic{ font-size:21px; line-height:1; transition:transform .15s; }
.tab-item.active{ color:var(--ac); }
.tab-item.active .tab-ic{ transform:translateY(-2px); }

/* 본문이 탭바에 가리지 않게 */
.main{ padding-bottom:calc(72px + env(safe-area-inset-bottom,0)) !important; }

/* 전체화면 모달의 스크롤 영역이 탭바에 가리지 않게 (마지막 항목까지 보이게) */
.rd-body, .pv-scroll, #settingsModal .co-body{
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0)) !important;
}

/* 설정을 탭 컨텍스트에 맞춰 전체화면화 (작업기록·보고서와 일관성) */
#settingsModal{
  align-items:stretch !important; justify-content:stretch !important;
  padding:0 !important; background:var(--bg) !important;
}
#settingsModal .co-box{
  max-width:none !important; width:100% !important;
  height:100% !important; max-height:none !important; min-height:0 !important;
  border-radius:0 !important; border:none !important;
}

/* 토스트를 탭바 위로 */
.toast{ bottom:calc(56px + 24px + env(safe-area-inset-bottom,0)) !important; }

/* 탭바 활성 인디케이터 (상단 바) */
.tab-item{ position:relative; }
.tab-item.active::before{
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:30px; height:3px; border-radius:0 0 3px 3px; background:var(--ac);
}


/* ★ 서브 팝업류는 탭바(z-index:1000)보다 위에 떠야 뒤 클릭이 차단됨 */
#coModal{z-index:1100 !important;}
#themePickerModal,#coModal{pointer-events:auto;}

/* ═══ 기록 카드 새 레이아웃 (작업명 안 잘리게) ═══ */
.cust-card-top{
  display:flex; align-items:baseline; gap:8px;
  flex-wrap:nowrap; margin-bottom:8px;
}
.cust-card-top .cust-card-name{
  font-weight:700; font-size:15px; color:var(--tx);
  flex:1 1 auto; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.3;
}
.cust-card-top .cust-unit{
  font-weight:700; color:var(--ac); white-space:nowrap; font-size:14px;
  flex-shrink:0;
}
.cust-card-bottom{
  display:flex; flex-direction:column; gap:10px;
}
.cust-card-info{
  display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px;
  font-size:12px; color:var(--mu); width:100%;
}
.cust-card-info .cust-phone{ color:var(--ac2); font-weight:600; white-space:nowrap; }
.cust-card-bottom .cust-card-actions{ display:flex; gap:6px; width:100%; }
.cust-card-bottom .cust-card-actions .cust-card-btn{ flex:1; justify-content:center; }


/* ═══ 복구: 순서편집·작업기록 모달 + 보고서 업체정보 (보고서테마 교체 시 누락분) ═══ */
.reorder-btn{background:var(--sf3);border:1px solid var(--ac);color:var(--ac);
  border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;
  white-space:nowrap;flex-shrink:0;}
.reorder-btn:active{background:var(--ac);color:#fff;}
.rd-modal{display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.92);
  z-index:400;
  align-items:stretch;justify-content:center;
  padding:0;}
/* 순서편집 모달은 전체화면 작업 → 탭바(z-index:1000) 위로 올려 저장 버튼이 안 가리게 */
#reorderModal{z-index:1100;}

.rd-modal.open{display:flex;}
.rd-box{width:100%;height:100%;
  background:var(--bg);
  display:flex;flex-direction:column;
  overflow:hidden;}
.rd-head{display:flex;align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--bd);
  background:var(--sf);
  flex-shrink:0;}
.rd-title{flex:1;font-size:16px;font-weight:700;color:var(--tx);}
.rd-close-btn{background:var(--sf3);border:1px solid var(--bd);color:var(--tx);
  border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;}
.rd-body{flex:1;overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  min-height:0;
  -webkit-overflow-scrolling:touch;}
.rd-foot{display:flex;gap:8px;justify-content:flex-end;
  padding:12px 16px;
  border-top:1px solid var(--bd);
  background:var(--sf);
  flex-shrink:0;}
.reorder-info{background:var(--sf3);border-radius:8px;padding:10px 12px;
  font-size:13px;color:var(--tx);margin-bottom:14px;line-height:1.5;}
.reorder-cols{display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  flex:1;
  min-height:0;
  align-content:start;}
.reorder-col{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;
  padding:10px;display:flex;flex-direction:column;gap:8px;
  min-width:0;min-height:80px;}
.reorder-col-target{outline:2px dashed var(--ac);outline-offset:-3px;background:rgba(61,142,240,0.08);}
.reorder-col-head{font-size:13px;font-weight:700;
  padding:6px 10px;text-align:center;
  background:var(--sf3);border-radius:8px;
  flex-shrink:0;}
.reorder-empty{padding:30px 14px;text-align:center;color:var(--mu);font-size:12px;}
.reorder-list{display:flex;flex-direction:column;gap:8px;}
.reorder-item{display:flex;align-items:center;gap:8px;
  background:var(--sf);border:1px solid var(--bd);border-radius:10px;
  padding:8px;
  position:relative;
  transition:box-shadow .15s, opacity .15s;
  user-select:none;
  -webkit-user-select:none;}
.reorder-drag-handle{font-size:22px;
  font-weight:700;
  color:var(--mu);
  cursor:grab;
  flex-shrink:0;
  padding:4px 6px;
  line-height:1;
  touch-action:none;
  margin-left:auto;
  letter-spacing:-1px;}
.reorder-drag-handle:active{cursor:grabbing;color:var(--ac);}
.reorder-item.reorder-dragging{opacity:.35;
  background:var(--sf2);}
.reorder-item.reorder-over{box-shadow:0 0 0 2.5px var(--ac);
  background:rgba(61,142,240,.08);}
.reorder-ghost{pointer-events:none;
  z-index:999;}
.reorder-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;
  background:var(--ac);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;}
.reorder-thumb{flex:1;
  min-width:0;
  aspect-ratio:1;
  max-height:clamp(70px, 20vw, 160px);
  border-radius:8px;
  object-fit:cover;
  background:var(--sf3);
  cursor:zoom-in;
  transition:opacity .15s;}
.reorder-thumb:active{opacity:.8;}
.reorder-arrows{flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.reorder-arrow{background:var(--sf3);border:1px solid var(--bd);color:var(--tx);
  border-radius:8px;padding:10px 12px;font-size:18px;cursor:pointer;
  min-width:46px;font-weight:700;touch-action:manipulation;}
.reorder-arrow:active{background:var(--ac);color:#fff;}
.reorder-arrow:disabled{opacity:.3;cursor:not-allowed;}
.reorder-del{position:absolute;top:4px;right:4px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(240,96,96,.85);
  border:none;color:#fff;
  font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;
  z-index:2;}
.reorder-del:active{background:var(--dn);}
.reorder-fullview{display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.95);z-index:1200;
  align-items:center;justify-content:center;
  overflow:hidden;
  touch-action:none;}
.reorder-fullview.open{display:flex;}
.reorder-fullview img{max-width:100%;max-height:100%;
  object-fit:contain;
  border-radius:4px;
  will-change:transform;}
.reorder-cols{gap:6px;}
.reorder-col{padding:8px;gap:6px;}
.reorder-thumb{max-height:clamp(60px,18vw,120px);}
.reorder-arrow{padding:8px 10px;min-width:40px;font-size:16px;}
.reorder-num{width:26px;height:26px;font-size:11px;}
.reorder-item{padding:6px;gap:6px;}
.reorder-thumb{max-height:clamp(100px,15vw,200px);}
.reorder-arrow{padding:12px 16px;min-width:52px;}
.rp-co-info{background:rgba(77,208,225,.08);
  border:1px solid rgba(77,208,225,.25);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:14px;
  display:flex;
  flex-direction:column;
  gap:6px;}
.rp-co-info-row{display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  line-height:1.4;}
.rp-co-info-ic{flex-shrink:0;
  font-size:13px;}
.rp-co-info-lbl{flex-shrink:0;
  color:#a8d4ff;
  font-weight:600;
  min-width:60px;}
.rp-co-info-val{color:rgba(255,255,255,.92);
  word-break:break-all;
  flex:1;}

/* ═══ 복구: 순서편집 반응형 (@media) ═══ */
@media (max-width:480px){
  .reorder-cols{gap:6px;}
  .reorder-col{padding:8px;gap:6px;}
  .reorder-thumb{max-height:clamp(60px,18vw,120px);}
  .reorder-arrow{padding:8px 10px;min-width:40px;font-size:16px;}
  .reorder-num{width:26px;height:26px;font-size:11px;}
  .reorder-item{padding:6px;gap:6px;}
}
@media (min-width:700px){
  .reorder-thumb{max-height:clamp(100px,15vw,200px);}
  .reorder-arrow{padding:12px 16px;min-width:52px;}
}


/* ═══ 보고서 테마 추가 6종 (총 12종) ═══ */

.rp-theme-teal .rp-foot{background:#f0fdfa;color:#0f766e;border-top-color:#ccfbf1;}
.rp-theme-teal .rp-notes{background:linear-gradient(135deg,#ccfbf1,#ccfbf1);border-left-color:#0d9488;}

.rp-theme-teal .rp-notes-title,
.rp-theme-teal .rp-notes-body{color:#0f766e;}
/* ── 앰버 ── */
.rp-theme-amber .rp-hero{
  background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 50%,#fde68a 100%);
  color:#0a1628;
}
.rp-theme-amber .rp-hero::before{background:radial-gradient(circle,rgba(217,119,6,.4) 0%,transparent 60%);}
.rp-theme-amber .rp-hero::after{background:radial-gradient(circle,rgba(217,119,6,.3) 0%,transparent 60%);}
.rp-theme-amber .rp-snw{color:rgba(180,83,9,.15);}
.rp-theme-amber .rp-brand-name,
.rp-theme-amber .rp-h1{color:#0a1628;}
.rp-theme-amber .rp-h1 .rp-accent{color:#d97706;}
.rp-theme-amber .rp-brand-tag,
.rp-theme-amber .rp-rpt-badge-lbl,
.rp-theme-amber .rp-eyebrow,
.rp-theme-amber .rp-desc-label,
.rp-theme-amber .rp-tel-lbl,
.rp-theme-amber .rp-meta-lbl{color:#b45309;}
.rp-theme-amber .rp-rpt-badge-num,
.rp-theme-amber .rp-sub{color:rgba(10,22,40,.7);}
.rp-theme-amber .rp-eyebrow{background:rgba(217,119,6,.15);border-color:rgba(217,119,6,.3);}

/* ═══════════════════════════════════════════════
   캘린더 뷰 (calendar.js) — 삼성 캘린더 스타일
═══════════════════════════════════════════════ */
.cal-wrap{display:flex;flex-direction:column;padding-bottom:80px;}
/* 네비게이션 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;}
/* ⭐ 2026-08-22 상단 '오늘' 버튼 + 라벨 가운데 묶음.
   ⚠️ min-width:0 이 있어야 긴 라벨(년월 + 건수)이 버튼을 밀어내지 않는다. */
/* ⚠️ '아주 크게'(배율 1.44)에서는 이 줄이 쓸 수 있는 CSS 폭이 285px 까지 줄어든다.
   ‹ 40 + 년월 95 + › 40 + 오늘 52 = 227 이라 년월은 늘 들어가지만 건수(전체 N건·N일)는 넘친다
   → 건수만 먼저 줄어들게 한다(년월·버튼은 절대 안 줄임). */
.cal-nav-mid{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:7px;}
.cal-nav-mid > .cal-nav-label{flex:0 0 auto;}
.cal-nav-sub{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cal-today-btn{flex:0 0 auto;background:none;border:1px solid var(--bd);color:var(--tx);
  font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;margin-left:2px;
  cursor:pointer;touch-action:manipulation;transition:background .12s;}
.cal-today-btn:active{background:var(--sf3);}
/* ★ 2026-08-27 펼침 보기 전환 버튼 — 펼친 동안에만 나타난다.
   ⚠️ 네비 줄은 배율 1.44 에서 CSS 폭 285px 뿐이다 → 글자 없이 글리프 하나, 폭을 최소로.
   ⚠️ 글리프(▦ ☰)는 배율을 따라 커져도 되므로 unzoom 예외를 걸지 않는다. */
.cal-view-btn{display:none;flex:0 0 auto;background:none;border:1px solid var(--bd);color:var(--tx);
  font-size:13px;line-height:1;padding:6px 9px;border-radius:999px;margin-left:4px;
  cursor:pointer;touch-action:manipulation;transition:background .12s;}
.cal-view-btn:active{background:var(--sf3);}
.cal-expanded .cal-view-btn{display:block;}
.cal-nav-label{font-size:18px;font-weight:800;color:var(--tx);letter-spacing:-.02em;}
.cal-nav-btn{background:none;border:none;color:var(--tx);width:40px;height:40px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;touch-action:manipulation;transition:background .12s;}
.cal-nav-btn:active{background:var(--sf3);}
/* 요일 행 */
.cal-dow-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:2px;}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--mu);padding:3px 0;}
.cal-dow.sun{color:var(--dn);}
.cal-dow.sat{color:var(--ac);}
/* 날짜 그리드 */
/* ⚠️ minmax(0,1fr) — 1fr 은 min-content 가 바닥이라, 글자 크기를 키우면(zoom) 칸 내용이
   열을 밀어내 격자가 가로로 넘치고 요일 헤더와 어긋난다(2026-08-17 실측: 배율 1.44 에서 칸 47→70px).
   0 을 바닥으로 두면 열은 언제나 정확히 1/7 이다. */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin-bottom:14px;position:relative;}
.cal-loading{grid-column:1/-1;text-align:center;padding:24px;color:var(--mu);font-size:13px;}
/* 날짜 셀 — 삼성식: 테두리 없음, 배경 투명 */
.cal-cell{display:flex;flex-direction:column;align-items:center;padding:5px 2px 6px;min-height:52px;cursor:default;-webkit-tap-highlight-color:transparent;overflow:hidden;}
.cal-cell.cal-has-evt{cursor:pointer;}
.cal-cell.cal-other-month{opacity:.32;}
/* 날짜 숫자 — 원형 하이라이트 */
.cal-day-num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--tx);border-radius:50%;line-height:1;}
.cal-cell.cal-sun .cal-day-num{color:var(--dn);}
.cal-cell.cal-sat .cal-day-num{color:var(--ac);}
/* 오늘: 테두리 원 */
.cal-today .cal-day-num{border:2px solid var(--ac);color:var(--ac);font-weight:700;}
/* 선택: 채워진 원 */
.cal-sel .cal-day-num{background:var(--ac);color:#fff !important;font-weight:700;}
/* 도트 행 */
/* ★ 2026-08-17 글자 크기(zoom) 예외 — 접힘(월 격자) 날짜 칸 안쪽만 기본 크기를 유지한다.
   settings.js 의 applyFontSize 가 --fs-unzoom(배율의 역수)을 내려준다.
   ⚠️ 여기서 빼지 않으면 '아주 크게'(배율 1.44)에서 칸 안쪽이 45px→31px 로 줄어드는데
      점은 5px×5개+간격이라 그대로 넘쳐 옆 날짜와 겹친다.
   ⭐ 2026-08-22 — 확장(전체화면)이 '세로 목록'으로 바뀌면서 .cal-icos 예외를 없앴었다.
      목록은 화면 폭을 통째로 쓰므로 글자 크기 설정이 그대로 먹는다.
   ⭐ 2026-08-27 — '달력 키우기'(격자 확대) 보기를 선택지로 되살리면서 .cal-icos 예외도 함께 되살렸다.
      7열 격자인 이상 배율을 올리면 칸이 45px→31px 로 **좁아지는데** 칸 안 내용은
      [아이콘 15 + 여백 3 + 시간 25 = 43px] 고정이라 옆 날짜를 침범한다. 이건 다듬어서 되는 게
      아니라 구조다 → 격자 보기에서는 칸 안쪽만 기본 크기를 유지한다.
      **글자를 키워 읽고 싶으면 목록 보기(☰)를 쓴다.** 이게 두 보기의 맞바꿈이다. */
.cal-dots{zoom:var(--fs-unzoom, 1);}
.cal-dots{display:flex;gap:3px;justify-content:center;min-height:7px;margin-top:2px;}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.cal-dot-work{background:var(--ac);}
.cal-dot-cust{background:var(--ac2);}
.cal-dot-more{background:var(--mu);}
/* 선택 상태에서 도트 색 */
.cal-sel .cal-dot-work{background:var(--ac);}
.cal-sel .cal-dot-cust{background:var(--ac2);}
/* 날짜 상세 패널 */
.cal-detail{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-top:4px;}
.cal-detail-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 10px;border-bottom:1px solid var(--bd);background:var(--sf2);}
.cal-detail-date{font-size:14px;font-weight:800;color:var(--tx);}
.cal-detail-cnt{font-size:11px;color:var(--mu);background:var(--sf3);border-radius:20px;padding:2px 9px;font-weight:700;}
.cal-detail-list{display:flex;flex-direction:column;}
.cal-work-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);}
.cal-work-card:last-child{border-bottom:none;}
.cal-work-card:active{background:var(--sf2);}
.cal-work-dot-col{display:flex;align-items:center;padding-top:2px;}
.cal-work-info{flex:1;min-width:0;}
.cal-work-apt{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-work-units{font-size:11px;color:var(--ac2);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-work-meta{font-size:11px;color:var(--mu);}
.cal-cust-card{opacity:.78;}
.cal-open-btn{flex-shrink:0;font-size:12px !important;padding:7px 13px !important;}
/* FAB 새 작업 버튼 */
.fab-new{position:fixed;right:18px;bottom:72px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;font-size:28px;line-height:1;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(61,142,240,.45);cursor:pointer;z-index:500;touch-action:manipulation;transition:transform .15s,box-shadow .15s;}
.fab-new:active{transform:scale(.92);box-shadow:0 2px 8px rgba(61,142,240,.3);}
.fab-new.visible{display:flex;}
/* ⭐ 2026-08-22 달력을 펼친 동안 이 버튼은 '▲ 달력으로'가 된다 (calendar.js _syncFab).
   ＋ 기준 28px 은 삼각형에 너무 커서 줄이고, 색만 살짝 눌러 '추가'와 다른 뜻임을 알린다. */
.fab-new.fab-back{font-size:20px;background:linear-gradient(135deg,var(--slate),var(--ac));}

/* ═══ 스케줄(달력) 모드: 달력 상단 고정, 작업 목록만 스크롤 (2026-06-19) ═══ */
/* 달력+목록 전체가 함께 스크롤 (달력 고정 해제) */
.rd-body.cal-mode{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 84px;display:block;overscroll-behavior:none;}
.rd-body.cal-mode .cal-wrap{display:block;}
.rd-body.cal-mode .cal-grid{margin-bottom:8px;}
.rd-body.cal-mode .cal-detail{display:flex;flex-direction:column;margin-bottom:0;}
.rd-body.cal-mode .cal-detail-head{position:sticky;top:0;background:var(--bg);z-index:2;padding:6px 0;}
.rd-body.cal-mode .cal-detail-list{overflow:visible;padding-bottom:0;}
/* 작업 없는 날짜 안내 */
.cal-empty-day{padding:22px 16px;text-align:center;color:var(--mu);font-size:13px;line-height:1.7;}
/* 모든 날짜(이번 달) 클릭 가능 표시 */
.cal-grid .cal-cell:not(.cal-other-month){cursor:pointer;}


/* ── 호수 카드 액션줄: 갤러리저장/순서편집/삭제 3버튼 균등 통일 ── */
.u-row2{justify-content:stretch;flex-wrap:nowrap;gap:6px;}
.u-row2 .u-act{flex:1 1 0;min-width:0;width:auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;padding:8px 4px;min-height:36px;border-radius:6px;white-space:nowrap;font-family:inherit;cursor:pointer;touch-action:manipulation;line-height:1;}
.u-gal-btn{background:rgba(0,201,167,.12);border:1px solid var(--ac2);color:var(--ac2);}
.u-gal-btn:active{background:var(--ac2);color:#fff;}


/* ── 스케줄: 좌측 작업시간 + 가격 ── */
.cw-flex{display:flex;gap:8px;align-items:stretch;}
.cw-time{flex-shrink:0;width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ac);background:var(--sf2);border-radius:8px;line-height:1.2;padding:4px 2px;}
.cw-time .cw-tilde{color:var(--mu);font-weight:400;font-size:10px;}
.cw-time .cw-notime{color:var(--mu);font-weight:400;}
.cw-body{flex:1;min-width:0;}
.cw-price{color:var(--ac2);font-weight:700;}

/* ── 월 매출 바 ── */
.cal-revenue{flex-shrink:0;margin:6px 0 4px;padding:8px 10px;background:var(--sf2);border-radius:10px;}
.cal-rev-title{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:5px;}
.cal-rev-row{display:flex;gap:6px;}
.cal-rev-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:5px 2px;border-radius:7px;background:var(--sf);}
.cal-rev-cell b{font-size:13px;}
.cal-rev-done b{color:var(--ac2);}
.cal-rev-pend b{color:var(--wn);}
.cal-rev-total b{color:var(--ac);}

/* ── 달력 살짝 축소 (매출바 공간 확보) ── */
.cal-day-num{width:28px;height:28px;font-size:13px;}
.cal-dots{min-height:6px;margin-top:1px;}

/* ── 가정용 가격/작업시간 입력 ── */
.cust-pt-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.cust-pt-lb{font-size:12px;color:var(--mu);flex-shrink:0;}
.cust-pt-tilde{color:var(--mu);}
.cust-pt-row .cust-time{flex:1;min-width:0;}
.cust-pt-row .cust-price{flex:1;}

/* 달력 점: 수행완료(청록) / 미수행(주황) */
.cal-dot-done{background:var(--ac2);}
.cal-dot-pending{background:var(--wn);}
.cal-sel .cal-dot-done{background:var(--ac2);}
.cal-sel .cal-dot-pending{background:var(--wn);}

.cw-target{color:var(--ac);font-weight:600;}
.cw-posts{color:var(--ac);font-weight:700;}


.cust-fld-lb{display:block;font-size:11px;color:var(--mu);font-weight:700;margin:9px 0 3px;}
.cust-time-row{display:flex;align-items:center;gap:6px;}
.cust-time-row .cust-time{flex:1;min-width:0;}

/* ═══ 시간칸 수행/미수행 색상 (calendar.js 작업 카드) ═══ */
.cw-time.cw-time-done{color:var(--ac2);background:rgba(0,201,167,.16);}
.cw-time.cw-time-done .cw-tilde{color:var(--ac2);opacity:.7;}
.cw-time.cw-time-pending{color:var(--wn);background:rgba(240,180,41,.16);}
.cw-time.cw-time-pending .cw-tilde{color:var(--wn);opacity:.7;}

/* ═══ 년월 선택 피커 ═══ */
.cal-nav-label-tap{cursor:pointer;}
.cal-nav-label-tap::after{content:'\25be';font-size:13px;color:var(--mu);margin-left:5px;vertical-align:middle;}
.cal-mp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:790;display:flex;align-items:center;justify-content:center;padding:20px;}
.cal-mp-box{background:var(--sf);border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.45);}
.cal-mp-yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-mp-yr-lbl{font-size:18px;font-weight:800;color:var(--tx);}
.cal-mp-yr-btn{background:none;border:none;color:var(--tx);width:42px;height:42px;font-size:24px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.cal-mp-yr-btn:active{background:var(--sf3);}
.cal-mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.cal-mp-month{padding:13px 0;background:var(--sf2);border:1.5px solid transparent;border-radius:10px;color:var(--tx);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation;}
.cal-mp-month:active{background:var(--sf3);}
.cal-mp-month.cur{border-color:var(--ac);}
.cal-mp-month.active{background:var(--ac);color:#fff;border-color:var(--ac);}
.cal-mp-close{width:100%;justify-content:center;}

/* ═══ 백업 폴더 선택(복원) 모달 ═══ */
.bk-choose-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:790;display:flex;align-items:center;justify-content:center;padding:20px;}
.bk-choose-box{background:var(--sf);border-radius:16px;padding:18px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.45);display:flex;flex-direction:column;max-height:80vh;}
.bk-choose-title{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:12px;}
.bk-choose-hint{font-size:11px;color:var(--mu);line-height:1.5;margin-bottom:10px;}
.bk-choose-hint b{color:var(--tx);}

.bk-choose-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.bk-choose-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;background:var(--sf2);border:1.5px solid transparent;border-radius:10px;color:var(--tx);font-family:inherit;cursor:pointer;text-align:left;touch-action:manipulation;}
.bk-choose-item:active{background:var(--sf3);}
.bk-choose-when{font-size:14px;font-weight:700;}
.bk-choose-when em{font-style:normal;color:var(--ac2);font-size:11px;font-weight:800;margin-left:4px;}
.bk-choose-raw{font-size:11px;color:var(--mu);}
.bk-choose-cancel{width:100%;justify-content:center;}

/* ── 공유 일정 (cloud share) ── */
.cal-dot-shared{background:#a855f7;}
/* ★ 2026-08-08 리마인더(개인 참고용 일정) — 작업/공유와 확실히 구분되는 회색 계열 */
.cal-dot-rem{background:#8b8fa3;}
.cal-bar-rem{background:#8b8fa3;}   /* 기간 리마인더 막대 (2026-08-17) */
.cw-time.cw-time-rem{color:#8b8fa3;background:rgba(139,143,163,.18);}
.cal-rem-card{border-left:3px solid #8b8fa3;}
.cal-rem-card.cal-rem-done{opacity:.5;}
.cal-rem-card.cal-rem-done .cust-card-name{text-decoration:line-through;}
/* ★ 가져오기 버튼: 사진이 있어 사용할 수 없는 상태(숨기지 않고 흐리게 표시) */
.cal-shared-take.cal-take-off{opacity:.42;}

/* ★ 여러 날 작업 기간 줄(바) — 시작~종료일까지 셀을 가로질러 이어짐 */
.cal-bars{align-self:stretch;display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.cal-bar{height:4px;background:var(--wn);}
.cal-bar-done{background:var(--ac2);}
.cal-bar-pending{background:var(--wn);}
.cal-bar-shared{background:#a855f7;}
.cal-bar-start{border-radius:3px 0 0 3px;margin-left:50%;margin-right:-2px;}
.cal-bar-mid{margin-left:-2px;margin-right:-2px;}
.cal-bar-end{border-radius:0 3px 3px 0;margin-left:-2px;margin-right:50%;}
.cal-bar-empty{background:transparent !important;}
.cal-wrap{overflow-x:hidden;}
/* ★ 공휴일: 날짜 빨간색 + 작은 이름 라벨 */
.cal-holiday .cal-day-num{color:var(--dn);}
.cal-holi-name{font-size:8px;color:var(--dn);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.cust-card-shared{border-left:3px solid #a855f7;}
.cw-time-shared{color:#a855f7;}
.cust-unit-shared{color:#a855f7;font-weight:700;}

/* ★ 아이템 팝업/오버레이는 하단 탭바(z-index:1000)보다 위에 떠서 뒤 탭 클릭 차단.
   (탭 패널인 customerModal/.rd-modal, settingsModal/.co-modal, pvModal은 제외) */
.dlg-backdrop, .sl-modal, .img-modal, .overlay,
.cal-mp-overlay, .bk-choose-overlay, .ob-modal,
#cloudModal { z-index: 1200 !important; }

/* ★ 로그인 모달은 온보딩(.ob-modal, 1200) '위'에 떠야 함 (온보딩 1단계에서 로그인 시 가려지는 문제) */
#cloudModal { z-index: 1300 !important; }

/* ⭐ 2026-08-22 달력 아래 '당기는 손잡이'.
   ⚠️ 무한 애니메이션 금지 — 3회만 튕기고 멈춘다(.cal-grab-hint 를 JS 가 3초 뒤 뗀다).
   ⚠️ 격자 바로 아래(월매출 위)에 둔다. 화면 맨 아래는 '⬆️ 위로 밀어 목록 보기'가 이미 쓰고 있다. */
.cal-grab{display:flex;flex-direction:column;align-items:center;gap:4px;
  margin:-10px 0 8px;padding:7px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;}
/* ⚠️ 2026-08-22 여기에 touch-action:pan-x 를 걸었다가 뺐다(같은 날 회수).
   손잡이 위에서 시작한 '세로 스크롤'을 브라우저가 아예 안 하게 만들어서, 손잡이가 죽은 구역이 됐다
   (아래로 당겨 펼치기가 아닌 경우 — 위로 밀기, 이미 스크롤된 상태에서 아래로 당기기 — 는 그냥 스크롤이어야 한다).
   #calGrid 도 touch-action 없이 잘 되는데, 이유는 '아래로 당겨 확장'이 body.scrollTop<=0 일 때만이라
   그 순간 브라우저는 스크롤할 것이 없어 제스처를 뺏기지 않기 때문이다. 같은 원리로 손잡이도 필요 없다. */
.cal-grab-bar{width:40px;height:4px;border-radius:99px;background:var(--bd);}
.cal-grab-tx{font-size:11px;font-weight:700;color:var(--mu);line-height:1;letter-spacing:-.2px;}
.cal-grab:active .cal-grab-bar{background:var(--mu);}
.cal-grab.cal-grab-hint{animation:calGrabPull .9s ease-in-out 3;}
@keyframes calGrabPull{0%{transform:translateY(0)}28%{transform:translateY(7px)}56%,100%{transform:translateY(0)}}
.cal-expanded .cal-grab{display:none!important;}

/* ⭐ 2026-08-22 업데이트 후 처음 열 때 '이번에 바뀐 것' 안내 (js/whatsnew.js)
   ⚠️ 구조는 .co-box 와 같은 '세로 flex + 본문만 스크롤' — 버튼(확인)이 절대 화면 밖으로 안 나간다
      ([[project_popup_overflow]] 의 교훈). 상한도 calc(100vh - 44px).
   ⚠️ z-index 는 1000 이상이어야 state.js closeTopPopup() 이 뒤로가기에서 찾아 닫아 준다. */
.wn-ov{position:fixed;inset:0;z-index:2600;display:none;align-items:center;justify-content:center;
  padding:22px 16px;background:rgba(0,0,0,.55);}
.wn-ov.open{display:flex;}
.wn-box{background:var(--sf);border-radius:18px;width:100%;max-width:420px;
  max-height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.45);}
.wn-head{padding:20px 20px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.wn-ver{font-size:12px;font-weight:800;color:var(--ac);}
.wn-lead{font-size:18px;font-weight:800;color:var(--tx);margin-top:6px;line-height:1.4;}
.wn-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 6px;}
.wn-block{margin-bottom:18px;}
.wn-bt{font-size:15px;font-weight:800;color:var(--tx);line-height:1.45;display:flex;gap:8px;align-items:flex-start;}
.wn-ic{flex:0 0 auto;font-size:17px;line-height:1.3;}
.wn-bd{font-size:13px;color:var(--slate,var(--mu));line-height:1.7;margin-top:6px;}
.wn-subs{margin:8px 0 0;padding-left:17px;}
.wn-subs li{font-size:12.5px;color:var(--mu);line-height:1.75;}
.wn-act{margin-top:11px;background:var(--brand-soft);color:var(--ac);border:0;border-radius:10px;
  padding:10px 15px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;}
.wn-act:active{opacity:.7;}
.wn-foot{padding:12px 20px 16px;border-top:1px solid var(--bd);flex-shrink:0;}
.wn-close{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;
  font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;}
.wn-close:active{opacity:.85;}

/* 스와이프업 힌트 (애니메이션) */
.cal-swipe-hint{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px;z-index:6;pointer-events:none;}
.cal-swipe-hint span{pointer-events:auto;cursor:pointer;background:rgba(20,22,30,.72);color:#fff;font-size:12px;font-weight:700;padding:7px 16px;border-radius:22px;box-shadow:0 3px 12px rgba(0,0,0,.4);animation:calHintBounce 1.6s ease-in-out infinite;}
@keyframes calHintBounce{0%,100%{transform:translateY(0);opacity:.7;}50%{transform:translateY(-7px);opacity:1;}}

/* ═══════════════════════════════════════════════════════════
   작업화면 리디자인 — 밝은 딥틸 (redesign.html 목업 기반)
   2026-07-18. 작업 탭(.hdr + .main)만 라이트 테마로 강제.
   토큰을 이 스코프에서 재정의 → 기존 var() 규칙이 자동으로 밝게 전환.
═══════════════════════════════════════════════════════════ */
/* ★ 라이트 딥틸: 정식 [data-theme="deepteal"] 테마로 전환(2026-07-20).
   토큰은 파일 상단 [data-theme="deepteal"]에 정의. 여기선 구조/배경만(토큰화). */
.main{ background:var(--bg); min-height:100vh; }
.hdr{ background:var(--sf); }

/* 공통 SVG 기본크기 (아이콘 폰트 대체) */
.hdr svg, .main svg{ stroke-width:1.8; }

/* ---- 헤더 버튼 위계 ---- */
.hdr-btns .btn svg{ width:16px; height:16px; flex:none; }
.hdr-btns .btn::first-letter{ font-size:inherit; }
.hdr .save-status{ color:var(--mu); font-weight:600; }
#btnSave.b-ghost{ background:var(--ac); border-color:var(--ac); color:#fff; }
#btnSave.b-ghost:hover,#btnSave.b-ghost:active{ color:#fff; }
#btnBlogAI.b-ghost{ background:var(--brand-soft); border:1px solid #CFE2E4; color:var(--ac); }
#btnBlogAI.b-ghost:hover,#btnBlogAI.b-ghost:active{ color:var(--ac); }
.hdr-toggle{ color:var(--mu); }

/* 작업유형 / 추가행 아이콘 */
.work-type-label svg{ width:15px; height:15px; vertical-align:-2px; margin-right:3px; }
.add-row .btn svg{ width:15px; height:15px; }

/* ---- 카드 헤더 (한 줄로 통합) ---- */
.u-card{ border-radius:14px; }
.u-top{ flex-direction:row; padding:12px 14px; }
.u-head{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; width:100%; min-width:0; }
.u-num{ width:22px; height:22px; border-radius:7px; background:var(--sf2); color:var(--slate);
  font-size:11.5px; font-weight:700; display:grid; place-items:center; flex:none; text-align:center; }
.u-name-row{ flex:1; min-width:0; }

/* ── 사진 영역: 전/후 전체폭 스택 + 4:3 썸네일 ──
   4:3 박스는 padding-bottom:75% 훅으로 만들어 aspect-ratio 미지원 WebView에서도 안전.

/* ── 호수 헤더의 저장된 글 칩 (2026-08-09) ───────────────
   글이 있는 걸 ＋ 버튼 안까지 들어가야 알 수 있어서,
   비어 있던 호수명 옆 공간에 채널 아이콘을 띄운다. */
.u-posts { display:flex; align-items:center; gap:4px; margin-right:2px; flex:0 0 auto; }
.u-post-chip {

/* ═══════════════════════════════════════════════════════════
   달력 확장 (아래로 당겨 늘리기) — 2026-08-16
   · 상단 헤더(.rd-head)와 하단 탭바는 그대로 두고, 그 사이를 달력이 채운다.
   · 확장 중에는 월매출·상세목록·스와이프 힌트를 감춘다.
   · grid-auto-rows:1fr 은 JS 가 인라인으로 넣는다(5줄/6줄 달 모두 대응).
═══════════════════════════════════════════════════════════ */
.rd-body.cal-mode.cal-expanded{overflow:hidden;}
/* 접을 때만 부드럽게 (2026-08-17)
   칸 '내용'(점/아이콘/막대)만 잠깐 흐려진 사이에 갈아 끼운다 — 날짜 숫자는 그대로 둔다.
   ⚠️ 펼칠 때는 이 연출을 쓰지 않는다(어색하다는 사용자 피드백).
   ⚠️ 매출·목록을 떠오르게 하는 연출(calFadeUp)도 넣었다가 화면이 살짝 위로 움직여 제거했다. */
.cal-grid .cal-icos, .cal-grid .cal-dots, .cal-grid .cal-bars{transition:opacity .22s ease-out;}
.cal-grid.cal-swapping .cal-icos,
.cal-grid.cal-swapping .cal-dots,
.cal-grid.cal-swapping .cal-bars{opacity:0;}

/* ⭐ 2026-09-21 접기 연출 (calendar.js _collapseAnim 주석에 왜 이렇게 했는지 적어 두었다)
   ☠️☠️ 움직이는 값은 **transform 과 opacity 뿐이다.** 높이(height)를 움직이면 매 프레임
        레이아웃이 다시 돌아 달력 42칸을 새로 재는데, 그게 폰에서 프레임이 빠지는 이유였다.
        transform·opacity 는 합성기(compositor)가 맡아 레이아웃 없이 흐른다.
        → 높이를 애니메이션하는 규칙을 여기에 **다시 넣지 말 것.**
   ⚠️ 곡선은 아이폰 시트가 닫히는 느낌(빠르게 떠나 천천히 멎는다)에 맞췄다.
      시간은 calendar.js 의 COLLAPSE_MS 와 **같이** 고칠 것 — 어긋나면 끝에서 툭 끊긴다.
   ☠️ 예전에는 .cal-grid.cal-swapping .cal-ag-day 로 목록을 숨겼다. 지금은 목록이 유령 안에 있어
      그 규칙을 그대로 두면 **유령이 그 자리에서 사라져** 걷히는 모습이 통째로 없어진다. 지웠다.
   ⚠️ 유령은 레이아웃 밖에 있어야 한다. 안 그러면 격자를 그리는 순간 목록이 아래로 밀려 덜컥인다.
   ⚠️ 격자 보기에서 접을 때는 유령도 7열 격자여야 한다 — 블록으로 두면 칸이 세로로 쏟아진다. */
/* ⚠️ 걷히는 목록은 **빨리 옅어지고 천천히 물러난다.** 옅어짐을 뒤로 미루면
      빽빽한 목록 글자가 날짜 숫자 위에 오래 겹쳐 지저분해 보인다(실측으로 고름). */
.cal-ghost{position:absolute;left:0;right:0;pointer-events:none;overflow:hidden;
  transition:opacity .2s cubic-bezier(.2,0,0,1),
             transform .38s cubic-bezier(.32,.72,0,1);}
.cal-ghost.out{opacity:0!important;transform:translateY(-30px);}
.cal-ghost-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;}
/* 유령 안의 칸은 '펼친 모습' 그대로여야 한다 — body 에서 cal-expanded 를 이미 벗겼기 때문 */
.cal-ghost-grid .cal-cell{justify-content:flex-start;padding:5px 1px;overflow:hidden;}

/* 달력 아래(손잡이·매출·상세)는 한 몸처럼 미끄러져 올라온다.
   ☠️ 시작 자리(--cal-dy)만 인라인으로 넣고, 움직임은 클래스 하나로 건다. */
.cal-sliding #calGrab,
.cal-sliding #calRevenue,
.cal-sliding #calDetail{transform:translateY(var(--cal-dy,0px));will-change:transform;}
.cal-slide-go #calGrab,
.cal-slide-go #calRevenue,
.cal-slide-go #calDetail{transform:translateY(0);
  transition:transform .38s cubic-bezier(.32,.72,0,1);}
/* 유령도 합성기에 올려 둔다 — 접히는 동안만. 늘 켜 두면 메모리를 물고 글자가 뿌예진다 */
.cal-ghost{will-change:transform,opacity;}
/* 맨 아래 힌트는 화면에 고정돼 있어 밀 것이 없다 → 제자리에서 떠오르게만 */
.cal-swipe-hint{transition:opacity .3s ease-out;}
.rd-body.cal-mode.cal-collapsing .cal-swipe-hint{opacity:0;}
/* 접히는 동안에는 매출·상세가 튀어나오거나 스크롤이 생기지 않게 잠가 둔다 */
.rd-body.cal-mode.cal-collapsing{overflow:hidden;}
/* ═══ 달 이동을 부드럽게 (2026-09-07) ═══════════════════════════════════════
   사용자 신고: "달력 이동할 때 깨끗하게 안 넘어가고 프레임이 적은 것처럼 버벅인다"
   달력 격자는 칸 42개에 점·막대·아이콘까지 들어 있어 그리는 값이 비싸다. 레이어로
   승격시켜 두면 옮기는 동안 다시 그리지 않고 **이미 그려 둔 그림을 밀기만** 한다.
   ☠️ will-change 를 항상 켜 두지 말 것 — 레이어를 계속 물고 있어 메모리를 먹고,
      기기에 따라 글자가 뿌옇게 보인다. 움직이는 동안에만 .cal-anim 을 붙였다 뗀다
      (calendar.js 의 _navAnimating · snapBack · 가로 드래그 판정 세 곳에서 관리). */
.cal-grid.cal-anim{will-change:transform,opacity;backface-visibility:hidden;}

/* ═══ 글 결과의 '사진으로 보기' (2026-09-07) ═══════════════════════════════
   사용자 요청: "찍고쓰다는 글 사이사이에 사진이 들어가는데 현장매니저는 마커만 들어간다"
   ☠️ 이 화면은 **보기 전용**이다. 복사·공유되는 글은 마커가 그대로 남아 있어야 한다
      (모바일에서 손으로 사진을 끼울 때 자리를 알려주는 유일한 표시 — js/ai.js 주석 참고). */
.post-pv{ border:1px solid var(--bd); border-radius:10px; background:var(--sf2,var(--sf));
          padding:12px 13px; font-size:13.5px; line-height:1.85; color:var(--tx);
          overflow-y:auto; -webkit-overflow-scrolling:touch; box-sizing:border-box; }
.post-pv p{ margin:0 0 11px; white-space:pre-wrap; word-break:break-word; }
.post-pv p:last-child{ margin-bottom:0; }
.post-pv img{ display:block; width:100%; height:auto; border-radius:9px; margin:12px 0; }
.post-pv .pv-empty{ color:var(--mu); font-size:12.5px; text-align:center; padding:14px 0; }
/* 참고 화면 — 사진 밑에 글에 박힌 마커를 글자 그대로 적는다 (2026-09-08)
   ☠️ 갤러리는 썸네일만 보여 주므로, 사진과 마커를 나란히 보여 주는 이 화면이
      모바일에서 짝을 맞추는 유일한 단서다. 마커를 빼지 말 것.
   ⚠️ 상자로 감싸는 이유: 붙여넣은 글에 (사진: 🔴 작업 전 1) 이 그대로 박혀 있어서,
      '글에 있는 그 표시' 라는 게 한눈에 보여야 대조가 된다. */
.post-pv .pv-fig{ margin:12px 0; }
.post-pv .pv-fig img{ margin:0; }
.post-pv .pv-fig figcaption{ display:flex; flex-wrap:wrap; justify-content:center;
                             align-items:center; gap:5px; padding:6px 0 0; }
.post-pv .pv-fig .pv-mk{ font-size:12px; font-weight:700; color:var(--ac);
                         background:var(--sf); border:1px solid var(--bd); border-radius:7px;
                         padding:3px 8px; word-break:keep-all; }
.post-pv .pv-fig .pv-no{ font-size:11px; font-weight:600; color:var(--mu); }
.cal-expanded .cal-revenue,
.cal-expanded .cal-detail,
.cal-expanded .cal-swipe-hint{display:none!important;}
.cal-expanded .cal-grid{margin-bottom:0;}
.cal-expanded .cal-cell{justify-content:flex-start;padding:5px 1px;overflow:hidden;}

/* 확장 상태의 날짜 칸 — 한 줄에 [업종 아이콘][시작시간].
   ⚠️ 칸 안쪽 너비가 45px 뿐이다. 아이콘 15 + 여백 3 + 시간 11px('09:30'≈25px) = 43px 이 상한이다.
      16/12px 로 키워 봤더니 시간 글자가 칸 경계를 넘어갔다(2026-08-17 실측).
      한글(현장명 등)은 3자에서 잘려 쓸 수 없어서 시간만 넣었다(사용자 선택).
      줄 높이 16px × 4줄 = 64px → 칸이 낮은 기기(작은 폰 6주 달)에서는 셀 overflow 로 잘린다. */
.cal-icos{zoom:var(--fs-unzoom, 1);}   /* ↑ 위 주석 참고 — 격자 보기 전용 예외 (2026-08-27 부활) */
.cal-icos{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:1px;}
.cal-erow{display:flex;align-items:center;gap:3px;height:16px;overflow:hidden;}
.cal-eic{width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;}
.cal-eic svg{display:block;}
.cal-etm{font-size:11px;font-weight:700;letter-spacing:-.3px;color:var(--tx);white-space:nowrap;}
.cal-enotm{color:var(--mu);font-weight:600;}
.cal-emore{font-size:9px;font-weight:800;color:var(--mu);text-align:center;height:11px;line-height:11px;}
/* 업종을 모르는 항목은 아이콘 자리에 점으로 (접힘 상태와 같은 색 규칙) */
.cal-eic .cal-dot{width:9px;height:9px;border-radius:50%;}

/* ⭐⭐ 2026-08-22 확장(전체화면) = 세로 목록(아젠다) — 'A안'
   왜: 격자는 '화면 폭 ÷ 7' 이라 칸 안쪽이 45px 뿐이었다 → 한글 현장명을 못 넣고,
       설정의 글자 크기를 칸 안쪽만 역수로 되돌려 빼야 했다(배율 올리면 칸이 오히려 좁아짐).
   ⚠️ 여기에는 고정 px '폭'이 하나도 없다. 그래서 zoom(글자 크기)이 그대로 먹는다 —
      새 규칙을 넣을 때 폭을 px 로 박지 말 것(예외를 다시 만들게 된다).
   ⚠️ 요일 머리글은 7열 전용이라 확장 중에는 숨긴다. */
/* ⭐ 2026-08-27 예전엔 확장이 곧 목록이라 요일 줄을 무조건 숨겼다.
   격자 보기가 돌아왔으므로 **목록 보기일 때만** 숨긴다 — 격자에는 일·월·화… 가 있어야 읽힌다. */
.cal-exp-list .cal-dow-row{display:none;}
.cal-grid.cal-agenda{position:relative;display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.cal-grid.cal-agenda .cal-cell{display:none;}   /* 혹시 남은 격자 칸이 섞여도 안 보이게 */

.cal-ag-day{display:flex;gap:9px;padding:8px 8px 8px 4px;border-bottom:1px solid var(--bd);cursor:pointer;}
.cal-ag-day:active{background:var(--sf2);}
.cal-ag-today{background:var(--brand-soft);}
.cal-ag-sel{box-shadow:inset 3px 0 0 var(--ac);}

/* 왼쪽 날짜 기둥 — '19 수' 한 줄, 그 아래 건수 (2026-08-22 사용자 요청: 3줄은 답답하다)
   폭은 글자에 맡긴다(min-width 만, 배율에 같이 커지도록 em) */
.cal-ag-date{flex:0 0 auto;min-width:3.4em;display:flex;flex-direction:column;align-items:center;
  line-height:1.15;padding-top:1px;}
.cal-ag-dline{display:flex;align-items:baseline;gap:3px;}
.cal-ag-dnum{font-size:19px;font-weight:800;color:var(--tx);}
.cal-ag-dow{font-size:12px;font-weight:700;color:var(--mu);}
.cal-ag-cnt{font-size:10px;color:var(--mu);margin-top:2px;}
.cal-ag-sun .cal-ag-dnum,.cal-ag-sun .cal-ag-dow{color:var(--dn);}
.cal-ag-sat .cal-ag-dnum,.cal-ag-sat .cal-ag-dow{color:var(--ac);}
.cal-ag-today .cal-ag-dnum{color:var(--ac);}

/* 오른쪽 일정 줄 — min-width:0 이 있어야 말줄임(text-overflow)이 먹는다 */
.cal-ag-items{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center;}
.cal-ag-holi{font-size:10px;font-weight:700;color:var(--dn);}
.cal-ag-row{display:flex;align-items:center;gap:6px;min-width:0;}
.cal-ag-ic{flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:17px;line-height:1;}
.cal-ag-ic svg{display:block;}
.cal-ag-ic .cal-dot{width:10px;height:10px;border-radius:50%;}
.cal-ag-tm{flex:0 0 auto;font-size:13px;font-weight:800;letter-spacing:-.3px;color:var(--tx);white-space:nowrap;}
.cal-ag-notm{color:var(--mu);font-weight:600;}
/* ⚠️ 자리가 모자랄 때 '제목'이 아니라 '보조 글자(호수)'가 먼저 줄어야 한다.
   flex-shrink 를 크게 줘서 보조 글자가 먼저 사라지게 하고, 잘릴 땐 …(말줄임) 없이 그냥 자른다
   (좁은 폭에서 "1…" 같은 부스러기만 남는 게 더 지저분했다). */
.cal-ag-ti{flex:1 1 auto;font-size:13px;font-weight:600;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-ag-sub{flex:0 999 auto;max-width:45%;font-size:11px;color:var(--mu);
  white-space:nowrap;overflow:hidden;text-overflow:clip;}
.cal-ag-empty{padding:34px 18px;text-align:center;color:var(--mu);font-size:13px;line-height:1.8;}
.cal-ag-row{cursor:pointer;}
/* 완료한 리마인더 — 날짜 목록의 .cal-rem-done 과 같은 규칙(흐리게 + 제목 취소선) */
.cal-ag-row.cal-ag-done{opacity:.5;}
.cal-ag-row.cal-ag-done .cal-ag-ti{text-decoration:line-through;}
.cal-ag-row:active{opacity:.55;}

/* ⭐ 2026-08-22 목록 줄을 누르면 뜨는 작은 메뉴 (열기·상세·삭제)
   ⚠️ body 직속이라 글자 크기(zoom) 밖이다 → JS 가 #customerBody 의 배율을 .cal-agm-box 에 복사한다. */
.cal-agm-ov{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:1560;
  display:flex;align-items:flex-end;transition:background .16s ease;}
.cal-agm-ov.open{background:rgba(0,0,0,.42);}
.cal-agm-box{width:100%;background:var(--sf);border-radius:16px 16px 0 0;padding:6px 10px 14px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 -6px 24px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .18s ease-out;}
.cal-agm-ov.open .cal-agm-box{transform:none;}
.cal-agm-head{padding:12px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px;}
/* ★ 2026-08-24 작업명 옆 빈 자리에 호수·작업대상 (사용자 요청)
   제목이 먼저 줄어들고(min-width:0), 칩은 제 글자만큼만 차지한다. 둘 다 길면 각자 잘린다. */
.cal-agm-tline{display:flex;align-items:baseline;gap:8px;}
.cal-agm-title{flex:1 1 auto;min-width:0;font-size:15px;font-weight:800;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-agm-meta{flex:0 1 auto;min-width:0;display:flex;gap:5px;justify-content:flex-end;}
.cal-agm-chip{font-size:12px;font-weight:700;color:var(--mu);background:var(--sf2);
  border-radius:8px;padding:2px 7px;max-width:11em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-agm-sub{font-size:12px;color:var(--mu);margin-top:3px;}
.cal-agm-item,.cal-agm-cancel{width:100%;display:flex;align-items:center;gap:12px;
  background:none;border:none;color:var(--tx);font-size:15px;font-weight:600;
  padding:14px 10px;border-radius:10px;cursor:pointer;text-align:left;}
.cal-agm-item:active,.cal-agm-cancel:active{background:var(--sf2);}
.cal-agm-ic{width:24px;text-align:center;font-size:17px;flex-shrink:0;}
.cal-agm-danger{color:var(--dn);}
.cal-agm-cancel{justify-content:center;color:var(--mu);font-weight:700;margin-top:4px;
  border-top:1px solid var(--bd);border-radius:0;}

/* 빈 날짜 목록: 패널을 한 화면 높이로 채워, 문구 아래 빈 공간에서도 좌우 스와이프가 먹게 */
.cal-detail.cal-detail-empty .cal-detail-list{flex:1;justify-content:center;}

/* ═══════════════════════════════════════════════
   지도 (2026-09-17)
   · 그날 지도 시트  .cm-*   (cal_map.js)
   · 주소 찍기 시트  .mp-*   (map_pick.js)
   ⚠️ 두 오버레이 모두 z-index 1000 이상이어야 뒤로가기(state.js closeTopPopup)가 본다.
      클래스 ov-lock 도 함께 붙어 있다 — 둘 중 하나만 빠져도 조용히 샌다.
   ☠️ z 를 함부로 내리지 말 것. 주소 찍기(.mp-ov)는 **주소 입력칸이 있는 창 위에서** 열린다.
      그 창들이 이미 높다 — 작업정보수정 1760 · 빠른작업추가 1840 · 고객수정 3200대 · 팀 3700.
      그래서 .mp-ov 는 4000 이다(카메라 99999 · 업데이트 게이트 100000 보다는 아래).
      1250 쯤으로 두면 지도가 그 창 뒤에 깔려 '눌러도 아무 일이 없는' 것처럼 보인다.
═══════════════════════════════════════════════ */

/* 목록 머리줄의 [지도] — 건수 배지와 한 묶음으로 오른쪽에 선다 */
.cal-detail-hd-rt{display:flex;align-items:center;gap:8px;}
.cal-detail-map{font-size:11px;font-weight:800;color:var(--ac);background:var(--brand-soft,var(--sf3));
  border:1px solid var(--ac);border-radius:20px;padding:3px 11px;cursor:pointer;font-family:inherit;
  min-height:0;touch-action:manipulation;}
.cal-detail-map:active{transform:scale(.95);}

/* ── 그날 지도 시트 ── */
.cm-ov{position:fixed;inset:0;z-index:3800;background:var(--bg);display:flex;flex-direction:column;
  overscroll-behavior:contain;}
.cm-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);
  background:var(--sf);flex:0 0 auto;}
.cm-head-tx{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;}
.cm-head-tx b{font-size:15px;font-weight:800;color:var(--tx);}
.cm-head-sub{font-size:11px;color:var(--mu);font-weight:700;}
.cm-close{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);
  background:var(--sf2);color:var(--tx);font-size:15px;cursor:pointer;font-family:inherit;}
.cm-map{flex:1 1 auto;min-height:180px;background:var(--sf2);position:relative;overflow:hidden;}
.cm-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 20px;font-size:13px;color:var(--tx);line-height:1.7;}
.cm-msg-sub{font-size:11.5px;color:var(--mu);}
/* 번호 표식 — 마커+라벨 두 겹보다 작고, 순서가 바로 읽힌다 */
.cm-pin{min-width:26px;height:26px;padding:0 7px;border-radius:14px;background:var(--ac);color:#fff;
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sf);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer;
  transform:translateY(6px);transition:transform .15s;}
.cm-pin.on{background:var(--ac2);transform:translateY(6px) scale(1.25);}
/* 내 위치 — 번호 표식과 **일부러 다르게** 생겼다(파란 점 + 흰 테).
   숫자를 붙이면 '0번 작업'처럼 보이고, 같은 모양이면 갈 곳으로 착각한다. */
.cm-me{width:16px;height:16px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(47,124,246,.35),0 2px 6px rgba(0,0,0,.4);pointer-events:none;}
/* 머리줄 '내 위치' 버튼 — 닫기와 같은 크기·모양으로 맞춘다(하나만 달라 보이면 어긋난다) */
.cm-loc{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);
  background:var(--sf2);color:var(--tx);font-size:16px;cursor:pointer;font-family:inherit;margin-right:6px;}
.cm-loc:disabled{opacity:.5;}
/* 카드 거리 줄 — 값이 없으면 자리도 차지하지 않는다(빈 줄이 보이면 카드가 어색해진다).
   ⚠️ 주소칸보다 작고 흐리게. 거리는 참고값이지 이 카드의 제목이 아니다. */
.cm-card-dist{display:none;font-size:11.5px;color:var(--mu);letter-spacing:-.2px;margin-top:1px;}
.cm-card-dist.on{display:block;}
/* 내 장소 칩 줄 (2026-09-19) — 머리줄과 지도 사이 얇은 한 줄.
   ⚠️ 머리줄에 같이 넣지 않는다. 390px 폭에서 날짜·건수·◎·✕ 만으로 이미 빠듯해,
      칩까지 넣으면 날짜가 두 줄로 밀린다(동선 보기 버튼에서 이미 겪은 일). */
.cm-places{flex:0 0 auto;display:flex;gap:6px;padding:6px 12px;background:var(--sf);
  border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cm-places::-webkit-scrollbar{display:none;}
.cm-chip{flex:0 0 auto;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--bd);
  background:var(--sf2);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
/* 아직 등록 안 한 칩 — 숨기지 않고 흐리게 둔다. 숨기면 그런 기능이 있는 줄을 모른다 */
.cm-chip-empty{opacity:.6;border-style:dashed;font-weight:500;}
.cm-chip-ret.on{background:var(--ac);border-color:var(--ac);color:#fff;}
/* 칩 줄 아래 안내 — 길게 누르기는 눈에 안 보이는 동작이라 적어 둔다.
   ⚠️ 지도 높이를 뺏지 않게 아주 얇게. 지도가 이 화면의 주인공이다. */
.cm-hint{flex:0 0 auto;padding:4px 12px 6px;background:var(--sf);border-bottom:1px solid var(--bd);
  font-size:10.5px;color:var(--mu);line-height:1.4;}
/* 복귀 카드·표식 — 작업 번호와 섞이지 않게 색을 달리한다 */
.cm-num-place{width:auto;min-width:20px;padding:0 6px;background:var(--mu);}
.cm-pin-place{background:var(--mu);}
.cm-card-place{border-style:dashed;}
/* 설정 화면 '내 장소' 칸 */
.pl-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);}
.pl-row:last-of-type{border-bottom:0;}
.pl-tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
.pl-tx b{font-size:13px;}
.pl-tx span{font-size:11.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-edit,.pl-del{flex:0 0 auto;font-size:12px;padding:6px 10px;}
.pl-help{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.5;}
/* 카드 줄 — 가로로 넘긴다. 한 장씩 멈추게(scroll-snap) 해야 가운데 판정이 흔들리지 않는다 */
.cm-cards{flex:0 0 auto;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0));background:var(--sf);
  border-top:1px solid var(--bd);scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;}
.cm-cards::-webkit-scrollbar{display:none;}
.cm-card{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--sf2);
  border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
.cm-card.on{border-color:var(--ac);background:var(--brand-soft,var(--sf3));}
.cm-card-noaddr{opacity:.72;}
.cm-card-top{display:flex;align-items:center;gap:7px;}
.cm-num{width:20px;height:20px;border-radius:10px;background:var(--ac);color:#fff;font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.cm-no{width:20px;height:20px;border-radius:10px;background:var(--sf3);color:var(--mu);font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.cm-time{font-size:11.5px;color:var(--mu);font-weight:700;}
.cm-card-ti{font-size:13.5px;font-weight:800;color:var(--tx);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

.mn-ov{position:fixed;inset:0;z-index:4000;background:var(--bg);display:flex;flex-direction:column;

.mn-ar{flex:0 0 auto;font-size:12px;color:var(--mu);transition:transform .15s;}
.mn-item.on .mn-ar{transform:rotate(180deg);color:var(--ac);}
.mn-b{padding:2px 14px 14px;border-top:1px solid var(--bd);}

.mn-steps{margin:12px 0 0;padding:0 0 0 2px;list-style:none;counter-reset:mn;}
.mn-steps li{position:relative;padding-left:28px;margin-bottom:16px;counter-increment:mn;}
.mn-steps li:last-child{margin-bottom:0;}
.mn-steps li::before{content:counter(mn);position:absolute;left:0;top:1px;
  width:19px;height:19px;border-radius:50%;background:var(--brand-soft);color:var(--ac);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.mn-steps li b{display:block;font-size:13.5px;font-weight:800;color:var(--tx);line-height:1.5;}
.mn-steps li span b{display:inline;font-size:inherit;color:var(--tx);}

.mn-tip{margin-top:13px;padding:10px 12px;border-radius:10px;
  background:var(--brand-soft);color:var(--ac);font-size:12px;font-weight:700;line-height:1.6;}

.mn-pics{margin-top:9px;display:flex;flex-direction:column;gap:10px;}
/* 단계 안에 들어간 그림 — 글 아래로 살짝 물려 단계에 붙어 보이게 한다 */
.mn-steps .mn-pics{margin-top:8px;margin-bottom:2px;}
.mn-steps li b + .mn-pics{margin-top:6px;}
.mn-fig{margin:0;}
.mn-fig img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);
  background:var(--sf2);cursor:zoom-in;}
.mn-fig figcaption{margin-top:5px;font-size:11.5px;color:var(--mu);line-height:1.6;}

/* ☠️ 세로로 긴 그림(휴대폰 화면 통째로)을 width:100% 로 두면 **화면 한 장을 통째로 먹는다.**
   390px 폭에서 9:19.5 캡처는 높이가 845px — 설명 한 줄 읽자고 한 화면을 넘겨야 한다.
   → 세로 그림은 폭을 묶어 가운데 놓는다. 가로/세로 판단은 manual.js 가 **그림을 실제로
     불러와서** 한다(사람이 표시를 빠뜨려도 알아서 맞는다). 눌러서 크게 볼 수 있다. */
.mn-fig-tall img{width:auto;max-width:200px;max-height:430px;margin:0 auto;}
.mn-fig-tall figcaption{text-align:center;}

/* 빈 자리는 만드는 사람에게만 보인다 (머리줄 제목 다섯 번).
   ⚠️ 액자 모양이 실제로 들어갈 그림과 달라야 할 이유가 없다 — 다르면 '이 비율로 어떻게
      넣지' 가 된다. shape:'tall' 을 적은 칸은 액자도 세로로 세운다. */
.mn-slotbox{display:flex;align-items:center;justify-content:center;height:120px;
  border:1px dashed var(--bd);border-radius:10px;background:var(--sf2);
  font-size:11.5px;color:var(--mu);}
.mn-slot-tall .mn-slotbox{width:200px;height:415px;margin:0 auto;}
.mn-slot-tall figcaption{text-align:center;}

/* ── 세로 그림 한 장짜리 단계: 글 왼쪽 / 그림 오른쪽 ── 2026-09-20
   ☠️ 세로 캡처를 글 아래에 깔면 단계 하나가 화면 절반을 먹는다(430px).
      옆으로 돌리면 같은 내용이 절반 높이에 들어간다.

   ⚠️ grid 로 두 칸을 나눴더니 **글이 짧은 단계는 왼쪽 아래가 통째로 비었다.**
      아낀 높이를 다른 모양으로 도로 까먹는 꼴이다.
      → float 로 바꾼다. 글이 짧으면 그림 옆에서 끝나고, 길면 그림 **아래로 흘러**
        폭을 전부 쓴다. 단계마다 글 길이가 제각각이라 이쪽이 맞다.
   ⚠️ 그림 칸을 넓게 잡으면 글이 한 줄에 열 자도 안 들어간다.
      390px 폭에서 글칸이 180px 는 남아야 읽힌다 → 그림은 112px.
      그 폭이면 화면 생김새는 알아보고, 자세히는 눌러서 크게 본다.
   ⚠️ 가로 조각에는 안 쓴다 — 절반 폭이면 가리키는 버튼이 안 보인다.
   ⚠️ li::before 는 번호 배지가 쓰고 있다. 띄움 해제는 ::after 로 한다. */
.mn-li-split > .mn-pics{float:right;width:112px;margin:2px 0 6px 12px;}
.mn-li-split::after{content:'';display:block;clear:both;}
.mn-li-split .mn-fig-tall img{max-width:100%;max-height:none;}
.mn-li-split .mn-slot-tall .mn-slotbox{width:100%;height:240px;}
/* ⚠️ 좁은 칸에서는 설명이 여덟 줄까지 늘어나 아낀 높이를 도로 까먹는다.
   세 줄로 끊는다 — 지금 들어 있는 긴 문구는 '무엇을 찍어 올지' 메모라서
   그림을 넣을 때 짧게 고치거나 지우면 이 제한에 걸리지 않는다. */
.mn-li-split figcaption{text-align:left;font-size:10px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
/* 화면이 넓으면 그림을 키운다 (태블릿·가로·PC 미리보기) */
@media (min-width:520px){
  .mn-li-split > .mn-pics{width:180px;}
  .mn-li-split .mn-slot-tall .mn-slotbox{height:385px;}
  .mn-li-split figcaption{font-size:10.5px;}
}

/* ── 동선 구간 색 (2026-09-20) ────────────────────────────────────
   선·핀·카드를 같은 색으로 묶는다. 색은 cal_map.js 의 SEG 가 --seg 로 넣어 준다.
   ☠️ 지도 위 요소(핀)는 **밝기 모드와 무관하게** 그 색 그대로 쓴다 —
