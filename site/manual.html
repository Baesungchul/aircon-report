<!doctype html><html lang="ko" data-mode="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장매니저 사용설명서</title>
<meta name="description" content="현장매니저 사용설명서 — 처음 쓰는 순서대로.">
<meta property="og:title" content="현장매니저 사용설명서">
<meta property="og:description" content="사진만 찍으면 보고서가 끝납니다. 처음 쓰는 순서대로 따라 하세요.">
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

/* 기본 테마: 다크 블루 */
:root{--fs-base:15px;--bg:#F4F6F8;--sf:#FFFFFF;--sf2:#F4F6F8;--sf3:#EEF1F3;--bd:#E6EAEE;--tx:#111820;--mu:#9AA4AE;--slate:#69747F;--before:#C4453A;--after:#1B8A5F;--before-soft:#FBEEE9;--dn:#C4453A;--wn:#C4453A;--ac:var(--ac-l,#0F5F6B);--ac2:var(--ac2-l,#1B8A5F);--brand-soft:var(--soft-l,#E7F1F2);}
/* ── 다크 모드: 라이트 구조를 그대로 어둡게 (강조색은 테마별 밝은 변형) ── */
html[data-mode="dark"]{--bg:#0F141A;--sf:#171E26;--sf2:#1E2730;--sf3:#263039;--bd:#2C3742;--tx:#E7ECF1;--mu:#7C8896;--slate:#9AA6B2;--before:#E5766B;--after:#3FB985;--before-soft:#3A211E;--dn:#E5766B;--wn:#E0B54A;--ac:var(--ac-d,#2FB3AD);--ac2:var(--ac2-d,#33C08A);--brand-soft:var(--soft-d,#123138);}

/* 미드나잇 (퍼플) */
[data-theme="midnight"]{--bg:#12101e;--sf:#1a1a2e;--sf2:#252142;--sf3:#342c56;--bd:#3a3260;--ac:#a855f7;--ac2:#ec4899;--tx:#e0dcf5;--mu:#8b85a8;--dn:#f06060;--wn:#f0b429;}

/* 포레스트 (그린) */
[data-theme="forest"]{--bg:#0d1a15;--sf:#142821;--sf2:#1c3a2e;--sf3:#254d3d;--bd:#2c5545;--ac:#10b981;--ac2:#34d399;--tx:#d5e8df;--mu:#7a9185;--dn:#f06060;--wn:#f0b429;}

/* 라이트 */
[data-theme="light"]{--ac-l:#1D66C9;--ac2-l:#3B82F6;--soft-l:#E4EEFC;--ac-d:#5BA3F5;--ac2-d:#7DB8F8;--soft-d:#14283E;}

/* 보고서 테마와 매칭되는 메인 테마 5종 */
/* 밝은 (노랑/오렌지 다크) */
[data-theme="bright"]{--ac-l:#0E7C56;--ac2-l:#12A277;--soft-l:#E3F3EC;--ac-d:#34C088;--ac2-d:#4FD39B;--soft-d:#123528;}

/* 어두운 (검정/보라) */
[data-theme="darkpurple"]{--ac-l:#7C3AED;--ac2-l:#9061F0;--soft-l:#F0E9FC;--ac-d:#A981F5;--ac2-d:#BCA0F8;--soft-d:#241A3A;}

/* 시원한 (청록/민트) */
[data-theme="cool"]{--ac-l:#0E7490;--ac2-l:#0891B2;--soft-l:#E0F2F7;--ac-d:#2FB6D6;--ac2-d:#55C9E6;--soft-d:#0F3038;}

/* 깔끔한 (블루 라이트) */
[data-theme="clean"]{--ac-l:#4338CA;--ac2-l:#6366F1;--soft-l:#E8EAFB;--ac-d:#8E93FF;--ac2-d:#A5A9FF;--soft-d:#20223F;}

/* 세련된 (검정/골드) */
[data-theme="premium"]{--ac-l:#BE123C;--ac2-l:#E11D48;--soft-l:#FBE4EA;--ac-d:#F26A8D;--ac2-d:#F58AA6;--soft-d:#3A1622;}

/* 라이트 딥틸(리디자인 기본 테마) */
[data-theme="deepteal"]{--ac-l:#0F5F6B;--ac2-l:#1B8A5F;--soft-l:#E7F1F2;--ac-d:#2FB3AD;--ac2-d:#33C08A;--soft-d:#123138;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);font-size:var(--fs-base);overscroll-behavior-y:contain;}

/* 모달 열려있을 때 body 스크롤 막기 */
body.modal-open{overflow:hidden;position:fixed;width:100%;}

/* HEADER - S22 친화적 */
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;width:100%;}
.logo-ic{width:40px;height:40px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.logo > div:nth-child(2){flex:1;min-width:0;overflow:hidden;}
.logo-tx{
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  word-break:keep-all;  /* 한국어 단어 단위 줄바꿈 */
}
.logo-ver{
  font-size:10px;
  color:var(--mu);
  font-weight:500;
  margin-top:2px;
  letter-spacing:0.3px;
}
/* 각 부분은 단어 안에서 잘리지 않음 */
.logo-tx-1, .logo-tx-2{
  white-space:nowrap;
  display:inline-block;
}
.logo-sb{font-size:11px;color:var(--mu);margin-top:2px;}

/* 좁은 화면(폴더블 접힘 등) - 폰트 축소 + 두 줄 허용 */
@media (max-width:480px){
  .logo-tx{font-size:13px;}
}
@media (max-width:380px){
  .logo-tx{font-size:13px;letter-spacing:-0.3px;}
  .logo-ic{width:34px;height:34px;font-size:17px;}
}
@media (max-width:320px){
  .logo-tx{font-size:12px;letter-spacing:-0.5px;}
  .logo-ic{width:30px;height:30px;font-size:15px;border-radius:8px;}
  .logo{gap:6px;}
}
.save-status{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .4s;}

/* ★ 2026-08-16 작업탭 업종 칩 — 최상단 우측 끝(저장 버튼 줄 위).
   margin-left:auto 로 오른쪽 끝에 붙는다(.logo 가 flex, width:100%). */
.work-ind-chip{
  margin-left:auto;flex-shrink:0;
  display:inline-flex;align-items:center;gap:5px;
  background:var(--sf2);border:1px solid var(--bd);color:var(--tx);
  font-size:12px;font-weight:700;line-height:1;
  padding:6px 10px;border-radius:999px;cursor:pointer;
  max-width:150px;
}
.work-ind-chip:active{background:var(--ac);color:#fff;}
.work-ind-chip:empty{display:none;}

/* 스케줄 목록 시간칸 위의 업종 아이콘
   ⚠️ .cw-time 이 flex column + justify-content:center 라 그냥 두면 시간에 딱 붙는다.
      아래 여백을 넉넉히 줘서 아이콘을 위로 띄운다. */
.cw-ind{font-size:16px;line-height:1;margin:-2px 0 8px;}

/* 고객·기록 목록의 업종 아이콘 */
.cust-ind{font-size:15px;line-height:1;margin-right:2px;flex-shrink:0;}

/* 월매출 업종별 내역 — 기본 접힘, 펼치면 한 줄에 한 업종 (업종 2개 이상일 때만) */
.cal-rev-ind-toggle{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  margin-top:7px;padding:6px 0 2px;background:none;border:none;cursor:pointer;
  color:var(--mu);font-size:11px;font-weight:700;}
.cal-rev-ind-toggle:active{color:var(--ac);}
.cal-rev-ind-arw{font-size:9px;opacity:.8;}
.cal-rev-ind{margin-top:5px;padding-top:6px;border-top:1px solid var(--bd);}
.cal-rev-ind[hidden]{display:none;}
.cal-rev-ind-row{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12px;}
.cal-rev-ind-row + .cal-rev-ind-row{border-top:1px solid rgba(128,128,128,.13);}
.cal-rev-ind-ic{flex-shrink:0;width:18px;text-align:center;display:inline-flex;align-items:center;justify-content:center;}
.cal-rev-ind-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:600;}
.cal-rev-ind-ct{flex-shrink:0;color:var(--mu);font-size:11px;font-weight:600;}
.cal-rev-ind-sum{flex-shrink:0;min-width:82px;text-align:right;color:var(--tx);font-weight:800;
  font-variant-numeric:tabular-nums;}

/* 헤더 접기/펼치기 */
.hdr-toggle{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:14px;flex-shrink:0;transition:transform .3s;display:flex;align-items:center;justify-content:center;}
.hdr-icon-btn{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;min-width:36px;height:36px;padding:0 8px;cursor:pointer;font-size:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:3px;margin-right:6px;}
.hdr-icon-btn:active{background:var(--ac);color:#fff;}
.hdr-toggle:active{background:var(--sf3);}
.hdr-collapsible{display:flex;flex-direction:column;gap:6px;width:100%;max-height:1400px;overflow:hidden;transition:max-height .35s ease,opacity .25s;opacity:1;}
.hdr.collapsed .hdr-collapsible{max-height:0;opacity:0;gap:0;}
.hdr.collapsed .hdr-toggle{transform:rotate(180deg);}
.save-status.saving{background:rgba(240,180,41,.2);color:var(--wn);opacity:1;}
.save-status.saved{background:rgba(0,201,167,.15);color:var(--ac2);opacity:1;}
.save-status.hide{opacity:0;}
.hdr-fields{display:grid;grid-template-columns:1.3fr 1.4fr 1fr;gap:6px;align-items:flex-end;width:100%;}

/* 작업 유형 라디오 */
.work-type-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:4px;
  width:100%;
}
.work-type-opt{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6px 4px;
  background:var(--sf2);
  border:1px solid var(--bd);
  border-radius:8px;
  cursor:pointer;
  user-select:none;
  transition:all 0.15s;
  gap:2px;
}
.work-type-opt input[type="radio"]{
  position:absolute;
  opacity:0;
}
.work-type-opt:has(input:checked){
  background:var(--brand-soft);
  border-color:var(--ac);
}
.work-type-label{
  font-size:13px;
  font-weight:700;
  color:var(--tx);
  line-height:1.2;
}
.work-type-opt:has(input:checked) .work-type-label{
  color:var(--ac);
}
.work-type-desc{
  font-size:10px;
  color:var(--mu);
  line-height:1.2;
}

/* 시설 고객 정보 영역 */
.facility-cust-sec{
  margin-top:8px;
  padding:8px 10px;
  background:rgba(77,208,225,.06);
  border:1.5px solid var(--ac);
  border-radius:10px;
  width:100%;
  box-sizing:border-box;
}
.facility-cust-row{
  display:flex;
  align-items:center;
  gap:8px;
}
.facility-cust-ic{
  font-size:14px;
  flex-shrink:0;
}
.facility-cust-main{
  min-width:0;
}
.facility-cust-detail{
  padding-top:4px;
}
/* 구버전 호환 - hdr 스타일 */
.facility-cust-hdr{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:8px;}
.facility-cust-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
@media (max-width:480px){.facility-cust-grid{grid-template-columns:1fr;}}

.hf{display:flex;flex-direction:column;gap:2px;min-width:0;}
.hf label{font-size:13px;color:var(--mu);letter-spacing:0;font-weight:700;white-space:nowrap;}
.hf input{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;color:var(--tx);font-family:inherit;font-size:15px;font-weight:600;width:100%;}
.hf input:focus{outline:none;border-color:var(--ac);}
.hf input[type="date"]{font-family:inherit;font-size:14px;letter-spacing:-.3px;padding:7px 4px;font-weight:700;text-align:center;}
.hf input[type="date"]::-webkit-date-and-time-value{text-align:center;}

/* ★ 버튼 그리드 - hdr 바깥에 있어서 접기와 무관하게 항상 표시 */
.hdr-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;padding:0;box-sizing:border-box;background:transparent;align-items:center;}
/* ★ 2026-08-08 가져오기 버튼이 보일 때는 3칸으로 — 안 그러면 2칸 그리드라 아랫줄로 밀린다 */
.hdr-btns.has-take{grid-template-columns:1fr 1fr 1fr;}

.hdr-btns .btn{min-height:46px;width:100%;justify-content:center;padding:8px 2px;font-size:14px;font-weight:700;letter-spacing:-0.3px;border-radius:9px;white-space:nowrap;gap:4px;}
.hdr-btns .btn::first-letter{font-size:1.25em;}
.hdr-btns .co-hdr-btn{min-height:36px;width:100%;font-size:11px;letter-spacing:-0.3px;}

@media (max-width:600px){
  .hdr-btns{gap:3px;padding:5px 10px;}
  .hdr-btns .co-hdr-btn{font-size:10px;padding:4px 1px;letter-spacing:-0.5px;}
}
@media (max-width:380px){
  .hdr-btns .co-hdr-btn{font-size:9px;}
}

/* BUTTONS - 터치 친화적 크기 */
.btn{padding:10px 14px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;touch-action:manipulation;min-height:40px;}
.btn:active{transform:scale(.96);}
.b-blue{background:var(--ac);color:#fff;}
.b-green{background:linear-gradient(135deg,var(--ac2),#00a884);color:#0d1117;}
.b-orange{background:linear-gradient(135deg,#f0832a,#e05c10);color:#fff;}
.b-gold{background:linear-gradient(135deg,#e0a020,#c07010);color:#fff;}
.b-ghost{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);}
.b-ghost:hover,.b-ghost:active{border-color:var(--ac);color:var(--ac);}
.b-red{background:rgba(240,96,96,.15);border:1px solid var(--dn);color:var(--dn);}
.b-xs{padding:7px 11px;font-size:12px;border-radius:6px;min-height:34px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--mu);padding:5px 7px;font-size:15px;touch-action:manipulation;}
.del-btn{background:rgba(240,96,96,.1);border:1px solid var(--dn);cursor:pointer;color:var(--dn);font-size:12px;padding:5px 11px;border-radius:6px;font-family:inherit;font-weight:700;touch-action:manipulation;min-height:32px;}

/* MAIN */
.main{padding:10px 12px;max-width:900px;margin:0 auto;}

.cmp-sec{display:none!important;}

/* STATS - 큰 숫자 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.stat-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--sf);border:1px solid var(--bd);
  border-radius:12px;padding:4px 8px;
  font-size:12px;font-weight:700;color:var(--ac);
  white-space:nowrap;flex-shrink:0;
}
.stat-chip-ic{font-size:12px;}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 6px;text-align:center;}
.stat-lbl{font-size:9px;color:var(--mu);text-transform:uppercase;margin-bottom:2px;font-weight:600;}
.stat-val{font-size:20px;font-weight:900;font-family:'DM Mono',monospace;line-height:1;}
.c-bl{color:var(--ac);}.c-gr{color:var(--ac2);}.c-wn{color:var(--wn);}.c-mu{color:var(--mu);}

/* ADD ROW - 터치 친화 */
.add-row{display:flex;gap:7px;margin-bottom:6px;}
.add-inp{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;color:var(--tx);font-family:inherit;font-size:15px;flex:1;min-width:0;}
.add-inp:focus{outline:none;border-color:var(--ac);}
.add-inp::placeholder{color:var(--mu);}
.toolbar{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:nowrap;}
.toolbar .srch{flex:1;min-width:0;}
.toolbar .btn{flex-shrink:0;padding:6px 8px;font-size:11px;}
.srch{flex:1;min-width:120px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:10px 13px;color:var(--tx);font-family:inherit;font-size:14px;}
.srch:focus{outline:none;border-color:var(--ac);}

/* UNIT CARDS - 가독성 향상 */
.unit-list{display:flex;flex-direction:column;gap:9px;}
.u-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.u-card.done{border-color:rgba(0,201,167,.5);}
.u-card.part{border-color:rgba(240,180,41,.5);}
.u-top{display:flex;flex-direction:column;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;}
.u-row1{display:flex;align-items:center;gap:10px;}
.u-row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.u-num{font-family:'DM Mono',monospace;font-size:13px;color:var(--mu);text-align:center;font-weight:700;width:24px;flex-shrink:0;}
.u-name-row{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
.u-name{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.u-name-inp{background:var(--sf2);border:1px solid var(--ac);border-radius:6px;padding:5px 10px;color:var(--tx);font-family:inherit;font-size:18px;font-weight:700;width:100%;max-width:240px;}
.u-name-inp:focus{outline:none;}
.bdg{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
.bdg-ok{background:rgba(0,201,167,.15);color:var(--ac2);}
.bdg-pt{background:rgba(240,180,41,.15);color:var(--wn);}
.bdg-no{background:rgba(240,96,96,.1);color:var(--dn);}
.u-chev{font-size:14px;color:var(--mu);transition:transform .2s;flex-shrink:0;}
.u-chev.open{transform:rotate(180deg);}
.u-body{display:none;padding:0 14px 14px;border-top:1px solid var(--bd);}
.u-body.open{display:block;}
.ph-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.ph-lbl{font-size:13px;font-weight:700;padding:6px 11px;border-radius:6px;margin-bottom:7px;}
.lbl-b{background:rgba(240,96,96,.12);color:#ff8a80;}
.lbl-a{background:rgba(0,201,167,.12);color:var(--ac2);}
.up-btns{display:flex;gap:5px;margin-bottom:8px;}
.up-btn{flex:1;min-width:0;padding:11px 2px;border-radius:8px;border:1.5px dashed var(--bd);background:var(--sf2);color:var(--mu);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;position:relative;overflow:hidden;white-space:nowrap;touch-action:manipulation;min-height:42px;}
.up-btn:active{border-color:var(--ac);color:var(--ac);}
.up-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.thumbs{display:grid;grid-template-columns:1fr;gap:8px;justify-items:stretch;}
.th-wrap{position:relative;}
/* 작업탭 인라인 순서 변경(길게 눌러 끌기) */
.th-wrap.ri-drag{opacity:.28;transition:opacity .1s;}
.ri-ghost{position:fixed;top:0;left:0;z-index:3000;pointer-events:none;border-radius:7px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:.95;will-change:transform;}
.ri-ghost img{width:100%;height:100%;object-fit:cover;display:block;border-radius:7px;}
.th-drag{position:absolute;top:50%;right:2px;transform:translateY(-50%);width:40px;height:40px;background:rgba(17,24,32,.28);color:rgba(255,255,255,.85);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;cursor:grab;z-index:4;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
.th-drag:active{cursor:grabbing;background:var(--ac);color:#fff;transform:translateY(-50%) scale(1.12);}
/* 드래그 중: 같은 카드의 작업 전/후 칸을 드롭 대상으로 강조(전↔후 이동 유도) + 빈 칸도 놓을 수 있게 최소 높이 */
.u-card.ri-active-card .thumbs{outline:2px dashed var(--ac,#2dd4bf);outline-offset:2px;border-radius:8px;min-height:44px;}
.u-card.ri-active-card .sp-photos{outline:2px dashed var(--ac,#2dd4bf);outline-offset:2px;border-radius:8px;}
.u-card.ri-active-card .th-wrap{transition:transform .12s ease;}
.th-wrap img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid var(--bd);cursor:pointer;display:block;}
.th-del{position:absolute;top:-5px;right:-5px;width:20px;height:20px;background:var(--dn);border:none;border-radius:50%;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.th-save{position:absolute;bottom:-5px;right:-5px;width:20px;height:20px;background:var(--ac2);border:none;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;text-decoration:none;font-weight:700;}
.th-save-btn{position:absolute;bottom:-5px;right:-5px;width:22px;height:22px;background:var(--ac2);border:none;border-radius:50%;color:#0d1117;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;font-weight:900;font-family:inherit;padding:0;}
.th-save-btn:active{transform:scale(.9);}
.th-saved{position:absolute;bottom:-5px;left:-5px;width:20px;height:20px;background:#16a34a;border:none;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2;}
/* ★ th-saved(저장됨)는 .th-wrap 모디파이어로만 쓰임 - 배지용 오프셋이 새서 사진이 왼쪽/아래로 밀리던 것 무효화 */
.th-wrap.th-saved{ position:relative; left:auto; right:auto; top:auto; bottom:auto; }
.sp-sec{margin-top:12px;border-top:1px solid var(--bd);padding-top:11px;}

/* 휴지통 섹션 */
.trash-sec{margin-top:12px;border-top:1px solid var(--bd);padding-top:11px;}
.trash-hdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--mu);cursor:pointer;padding:6px 8px;border-radius:8px;background:var(--sf2);}
.trash-hdr:active{transform:scale(.99);}
.trash-arrow{font-size:11px;}
.trash-content{margin-top:8px;}
.trash-actions{display:flex;gap:8px;margin-bottom:8px;}
.trash-restore-all,.trash-empty{flex:1;font-size:12px;padding:7px;border-radius:7px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);}
.trash-restore-all{color:var(--ok);}
.trash-empty{color:var(--dn);}
.trash-restore-all:active,.trash-empty:active{transform:scale(.97);}
.trash-thumbs{display:flex;flex-wrap:wrap;gap:8px;}
.trash-thumb{position:relative;width:64px;height:64px;border-radius:7px;overflow:hidden;border:1px solid var(--bd);opacity:0.75;}
.trash-thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(0.3);}
.trash-thumb-type{position:absolute;left:3px;top:3px;font-size:9px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:4px;}
.trash-restore-one{position:absolute;right:2px;bottom:2px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(16,185,129,.9);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
.trash-restore-one:active{transform:scale(.9);}
.sp-hdr{font-size:13px;font-weight:700;color:var(--wn);margin-bottom:8px;}
.sp-item{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;}
.sp-header{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
.sp-header .sp-txt{flex:1;min-width:0;}
.sp-del{
  flex-shrink:0;
  background:rgba(240,96,96,.15);
  border:1px solid var(--dn);
  color:var(--dn);
  cursor:pointer;
  font-size:14px;
  width:36px;height:36px;
  border-radius:6px;
  font-family:inherit;
  font-weight:700;
  touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
}
.sp-del:active{background:rgba(240,96,96,.35);}
.sp-photos{display:flex;flex-wrap:wrap;gap:5px;margin-top:0;align-items:center;}
.sp-add-btns{display:flex;gap:5px;}
.sp-txt{width:100%;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:14px;resize:none;outline:none;min-height:50px;padding-right:60px;line-height:1.5;}
.sp-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;align-items:start;width:100%;}
.add-sp-btn{width:100%;padding:10px;background:rgba(240,180,41,.1);border:1.5px dashed var(--wn);border-radius:8px;color:var(--wn);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;min-height:42px;}
.add-sp-btn:active{background:rgba(240,180,41,.2);}
.empty{text-align:center;padding:50px 16px;color:var(--mu);}
.empty-ic{font-size:40px;opacity:.2;margin-bottom:10px;}

/* ── SAVE DIALOG ── */
.dlg-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;padding:20px;}
.dlg-backdrop.open{display:flex;}
/* ⚠️ 2026-08-22 여긴 max-height 가 아예 없었다 → 글자 크기를 키우면 상자가 자라
   버튼 줄(.dlg-foot)이 화면 밖으로 나가고, 배경(.dlg-backdrop)은 스크롤이 안 돼 누를 방법이 없었다.
   세로 flex 로 바꿔 본문만 스크롤시키고 머리·버튼은 항상 보이게 한다(.co-box 와 같은 구조). */
.dlg-box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:420px;
  overflow:hidden;max-height:calc(100vh - 40px);display:flex;flex-direction:column;}
.dlg-head{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.dlg-title{font-size:16px;font-weight:700;}
.dlg-body{padding:18px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.dlg-label{font-size:12px;color:var(--mu);margin-bottom:7px;}
.dlg-input{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:11px 14px;color:var(--tx);font-family:inherit;font-size:15px;}
.dlg-input:focus{outline:none;border-color:var(--ac);}
.dlg-hint{font-size:10px;color:var(--mu);margin-top:6px;}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

/* ── SAVE LIST MODAL ── */
.sl-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:flex-end;justify-content:center;}
.sl-modal.open{display:flex;}
.sl-box{background:var(--sf);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
.sl-head{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.sl-title{font-size:14px;font-weight:700;}
.sl-body{overflow-y:auto;padding:12px;flex:1;}
.sl-item{background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.sl-info{flex:1;cursor:pointer;min-width:0;}
.sl-name{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl-meta{font-size:10px;color:var(--mu);}
.sl-btns{display:flex;gap:5px;flex-shrink:0;}
.sl-empty{text-align:center;padding:36px;color:var(--mu);font-size:12px;}
.sl-count{font-size:10px;color:var(--mu);text-align:center;padding:6px;border-top:1px solid var(--bd);margin-top:4px;}

/* PREVIEW */
.pv-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:200;flex-direction:column;}
.pv-modal.open{display:flex;}
.pv-bar{flex-shrink:0;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 10px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.pv-title{font-size:13px;font-weight:700;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.pv-btns{display:flex;gap:4px;flex-shrink:0;}
.pv-btns .btn{padding:6px 8px;font-size:11px;min-height:32px;white-space:nowrap;}
/* 보고서 미리보기 - 두 손가락 줌은 자체 처리 (CSS transform) */
.pv-scroll{
  flex:1;
  overflow:auto;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  /* ★ "safe center" - 핵심
     - 들어가면 가운데 정렬
     - 넘치면 자동으로 좌측 정렬 (scrollLeft로 모든 부분 도달 가능)
     - 전환이 "콘텐츠폭=컨테이너폭" 순간에 일어나서 점프 없음
     - 절대 그냥 "center"로 되돌리지 말 것 (확대 시 가운데→좌측 점프 발생, 1.220 수정)
     - JS .zoomed 클래스 토글로 align-items를 바꾸는 방식도 같은 점프 유발 - 그것도 금지 */
  align-items:safe center;
  gap:16px;
  background:#2a2a2a;
  touch-action:pan-x pan-y;
  -webkit-overflow-scrolling:touch;
}
/* ★ .zoomed 클래스는 이제 무의미한 마커 (호환성을 위해 남겨두지만 layout 영향 X)
   align-items 오버라이드를 다시 넣지 말 것 - 위 주석 참고 */
.pv-scroll *{touch-action:inherit;}
.pv-scroll .rpage{
  transform-origin:top left;
  will-change:transform;
  image-rendering:auto;
}
.pv-pg-scaled{
  flex-shrink:0;
  box-shadow:0 6px 28px rgba(0,0,0,.7);
  overflow:hidden;
}
.pv-scroll.pinching .rpage{
  transition:none;
}
.pv-pg-wrap{position:relative;}
.pv-pg-num{position:absolute;top:-16px;left:0;font-size:9px;color:#999;font-family:'DM Mono',monospace;}

/* IMAGE MODAL - 핀치 줌 가능 */
.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:400;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
.img-modal.open{display:flex;}
.img-modal img{max-width:95vw;max-height:92vh;border-radius:8px;object-fit:contain;will-change:transform;}
.img-x{position:absolute;top:14px;right:14px;width:34px;height:34px;background:var(--sf);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;border:1px solid var(--bd);z-index:10;}
.img-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:66px;background:rgba(0,0,0,.35);color:#fff;border-radius:8px;display:none;align-items:center;justify-content:center;font-size:34px;line-height:1;cursor:pointer;z-index:11;user-select:none;-webkit-user-select:none;}
.img-prev{left:10px;}
.img-next{right:10px;}
.img-count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700;z-index:11;display:none;}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:contain;}
.overlay.show{display:flex;}
/* 오버레이 활성화 시 뒤 화면 스크롤 차단 (포인터 이벤트는 유지 - 권한 다이얼로그 대응) */
body.overlay-active{overflow:hidden!important;}
.ov-box{background:var(--sf);border:1px solid var(--bd);border-radius:13px;padding:26px 34px;text-align:center;min-width:230px;}
.ov-title{font-size:13px;font-weight:700;margin-bottom:11px;}
.prog-tr{height:5px;background:var(--sf3);border-radius:3px;overflow:hidden;}
.prog-fl{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px;transition:width .3s;width:0%;}
.prog-lb{font-size:10px;color:var(--mu);margin-top:7px;}

/* TOAST - 가독성 향상 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sf2);border:1.5px solid var(--bd);border-radius:10px;padding:13px 20px;font-size:14px;font-weight:700;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;}
.toast.ok{border-color:var(--ac2);color:var(--ac2);background:rgba(0,201,167,.08);}
.toast.err{border-color:var(--dn);color:var(--dn);}

/* ═══════════════════════════
   REPORT PAGE STYLES
═══════════════════════════ */
.rpage{width:794px;background:#fff;color:#111;font-family:'Noto Sans KR',sans-serif;position:relative;}

/* ── 표지 (Cover) ── */
.rp-cover{height:1123px;display:flex;flex-direction:column;overflow:hidden;background:#fff;}

/* HERO - 표지 상단 고정 크기 (페이지의 약 45%) */
.rp-hero{
  flex-shrink:0;
  background:linear-gradient(135deg,#0a1628 0%,#1e3a5f 50%,#2c5282 100%);
  padding:36px 48px 32px;position:relative;overflow:hidden;color:#fff;
}
.rp-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:460px;height:460px;background:radial-gradient(circle,rgba(77,208,225,.22) 0%,transparent 60%);border-radius:50%;filter:blur(40px);}
.rp-hero::after{content:'';position:absolute;bottom:-30%;left:-10%;width:360px;height:360px;background:radial-gradient(circle,rgba(128,222,234,.12) 0%,transparent 60%);border-radius:50%;filter:blur(40px);}
.rp-snw{position:absolute;color:rgba(255,255,255,.08);pointer-events:none;}
.rp-snw:nth-child(1){top:24px;right:70px;font-size:22px;opacity:.4;}
.rp-snw:nth-child(2){top:70px;right:160px;font-size:14px;opacity:.3;}
.rp-snw:nth-child(3){bottom:80px;right:50px;font-size:28px;opacity:.2;}
.rp-snw:nth-child(4){top:120px;right:34px;font-size:12px;opacity:.5;}

.rp-hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;position:relative;z-index:2;}
.rp-brand{display:flex;align-items:center;gap:15px;}
.rp-brand-logo{width:56px;height:56px;background:linear-gradient(135deg,#4dd0e1,#80deea);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 22px rgba(77,208,225,.35);overflow:hidden;}
.rp-brand-name{font-size:26px;font-weight:800;letter-spacing:-.02em;}
.rp-brand-tag{font-size:12px;color:#80deea;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}
.rp-rpt-badge{text-align:right;position:relative;z-index:2;}
.rp-rpt-badge-lbl{font-size:11px;letter-spacing:.18em;color:#80deea;font-weight:600;text-transform:uppercase;margin-bottom:4px;}
.rp-rpt-badge-num{font-size:15px;color:rgba(255,255,255,.8);letter-spacing:.05em;font-weight:600;}

.rp-hero-title{position:relative;z-index:2;margin-bottom:16px;}
.rp-eyebrow{display:inline-block;padding:6px 15px;background:rgba(77,208,225,.15);border:1px solid rgba(77,208,225,.3);border-radius:100px;font-size:12px;font-weight:700;color:#80deea;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
.rp-h1{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1.15;margin-bottom:0;}
.rp-h1 .rp-accent{color:#4dd0e1;}
.rp-sub{font-size:15px;color:rgba(255,255,255,.75);font-weight:500;margin-bottom:28px;}

/* 업체 소개글 박스 */
.rp-desc-box{background:rgba(255,255,255,.07);border-left:3px solid #4dd0e1;border-radius:8px;padding:12px 16px;margin-bottom:12px;position:relative;z-index:2;}
.rp-desc-label{font-size:11px;color:#80deea;font-weight:700;letter-spacing:.1em;margin-bottom:6px;text-transform:uppercase;}
.rp-desc-text{font-size:14px;color:rgba(255,255,255,.95);line-height:1.65;font-weight:500;}

/* 대표 전화번호 박스 (큼지막) */
.rp-tel-box{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(77,208,225,.18),rgba(0,201,167,.12));border:1.5px solid rgba(77,208,225,.4);border-radius:12px;padding:12px 18px;margin-bottom:16px;position:relative;z-index:2;box-shadow:0 4px 16px rgba(0,201,167,.15);}
.rp-tel-ic{font-size:30px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(77,208,225,.5));}
.rp-tel-body{flex:1;min-width:0;}
.rp-tel-lbl{font-size:11px;color:#80deea;font-weight:700;letter-spacing:.12em;margin-bottom:3px;text-transform:uppercase;}
.rp-tel-num{font-size:26px;font-weight:900;color:#fff;letter-spacing:.02em;font-family:'DM Mono',monospace;line-height:1.1;}

.rp-meta-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);position:relative;z-index:2;}
.rp-meta-cell{background:rgba(10,22,40,.4);padding:14px 16px;}
.rp-meta-lbl{font-size:11px;color:#80deea;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.rp-meta-val{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;}

/* KPI 카드 */
.rp-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 48px 0;}
.rp-kpi{padding:18px 16px;background:#fff;border:1px solid rgba(10,22,40,.08);border-radius:12px;}
.rp-kpi.rp-khi{background:linear-gradient(135deg,#f0fdfa,#ecfeff);border-color:rgba(77,208,225,.3);}
.rp-kpi.rp-kwn{background:linear-gradient(135deg,#fff7ed,#fffbeb);border-color:rgba(243,156,18,.25);}
.rp-kpi-lbl{font-size:13px;color:#475569;font-weight:600;margin-bottom:8px;}
.rp-kpi-num{font-size:34px;font-weight:900;letter-spacing:-.03em;color:#0a1628;}
.rp-kpi-unit{font-size:15px;color:#64748b;font-weight:600;margin-left:3px;}
.rp-khi .rp-kpi-num{color:#0e7490;}
.rp-kwn .rp-kpi-num{color:#c2410c;}

/* 목록 */
.rp-list-wrap{flex:1;padding:18px 48px 0;overflow:hidden;}
.rp-list-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.rp-list-bar{width:5px;height:20px;background:linear-gradient(180deg,#1e3a5f,#4dd0e1);border-radius:4px;}
.rp-list-txt{font-size:17px;font-weight:800;color:#0a1628;letter-spacing:-.02em;}
.rp-list-cnt{margin-left:auto;font-size:13px;color:#64748b;font-weight:600;}

.rp-wtbl{width:100%;background:#fff;border:1px solid rgba(10,22,40,.08);border-radius:12px;overflow:hidden;border-collapse:separate;border-spacing:0;}
.rp-wtbl thead th{background:#f8fafc;padding:11px 14px;font-size:13px;font-weight:700;color:#475569;letter-spacing:.03em;text-align:left;border-bottom:1px solid rgba(10,22,40,.08);}
.rp-wtbl thead th.tc{text-align:center;}
.rp-wtbl tbody td{padding:11px 14px;font-size:14px;color:#0a1628;border-bottom:1px solid rgba(10,22,40,.06);}
.rp-wtbl tbody tr:last-child td{border-bottom:none;}
.rp-wtbl tbody td.tc{text-align:center;}
/* ★ compact: 특이사항 있을 때 행 간격 줄임 */
.rp-wtbl-compact thead th{padding:8px 14px;font-size:12px;}
.rp-wtbl-compact tbody td{padding:8px 14px;font-size:13px;}

/* 다단 그리드 레이아웃 (8건 이상) */
.rp-grid{display:grid;gap:6px;}
.rp-grid-2{grid-template-columns:1fr 1fr;}
.rp-grid-3{grid-template-columns:1fr 1fr 1fr;gap:5px;}
.rp-gitem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(10,22,40,.08);border-radius:8px;padding:8px 10px;}
.rp-gitem .rp-wnum{flex-shrink:0;}
.rp-gitem .rp-ho{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.rp-gstatus{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.rp-gpst{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;}
.rp-gpst.d{background:#f0fdf4;color:#16a34a;}
.rp-gpst.e{background:#fef2f2;color:#dc2626;}

/* 3단일 때 더 컴팩트하게 */
.rp-grid-3 .rp-gitem{padding:6px 8px;gap:5px;}
.rp-grid-3 .rp-wnum{width:20px;height:20px;font-size:10px;}
.rp-grid-3 .rp-ho{font-size:11px;}
.rp-grid-3 .rp-gpst{width:17px;height:17px;font-size:9px;}
.rp-grid-3 .rp-pill{padding:1px 6px;font-size:9px;}
.rp-wnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#f1f5f9;color:#475569;border-radius:50%;font-size:13px;font-weight:700;}
.rp-ho{font-weight:700;font-size:16px;letter-spacing:-.01em;}
.rp-pst{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-size:16px;font-weight:700;}
.rp-pst.e{background:#fef2f2;color:#dc2626;}
.rp-pst.d{background:#f0fdf4;color:#16a34a;}
.rp-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:100px;font-size:13px;font-weight:700;}
.rp-pill::before{content:'';width:6px;height:6px;border-radius:50%;}
.rp-pill.pnd{background:#fef3c7;color:#92400e;}.rp-pill.pnd::before{background:#f59e0b;}
.rp-pill.don{background:#d1fae5;color:#065f46;}.rp-pill.don::before{background:#16a34a;}

/* 특이사항 */
.rp-notes{margin:14px 48px 0;padding:14px 18px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border-left:3px solid #f39c12;border-radius:4px 12px 12px 4px;flex-shrink:0;}
.rp-notes-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.rp-notes-ic{width:20px;height:20px;background:#f39c12;color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.rp-notes-title{font-size:14px;font-weight:700;color:#78350f;}
.rp-notes-body{font-size:13px;color:#78350f;opacity:.9;line-height:1.65;}

/* 업체정보 카드 (표지) */
.rp-co-card{margin:16px 48px 0;padding:16px 20px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid rgba(14,165,233,.2);border-left:3px solid #0284c7;border-radius:10px;flex-shrink:0;}
.rp-co-card-title{font-size:14px;font-weight:800;color:#0369a1;margin-bottom:10px;letter-spacing:-.01em;}
.rp-co-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px;}
.rp-co-card-row{display:flex;align-items:baseline;gap:10px;font-size:13px;line-height:1.55;}
.rp-co-card-lbl{color:#64748b;font-weight:600;flex-shrink:0;width:95px;letter-spacing:-.02em;}
.rp-co-card-val{color:#0a1628;font-weight:700;word-break:break-all;flex:1;min-width:0;}

/* 표지 푸터 */
.rp-cv-foot{padding:14px 48px;background:#f8fafc;border-top:1px solid rgba(10,22,40,.08);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#64748b;flex-shrink:0;}
.rp-cv-foot-brand{font-weight:700;color:#1e3a5f;}
/* 표지 맨 아래 한 줄 — 눈에 걸리지 않을 만큼 작고 연하게. 서류가 주인공이다 */
.rp-made{font-size:10.5px;color:#a3b0bf;letter-spacing:-.2px;white-space:nowrap;}

/* ── 상세 페이지 (Detail) ── */
.rp-det{height:1123px;display:flex;flex-direction:column;overflow:hidden;}
.rp-head{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0a2a6e,#0d47a1);color:#fff;padding:10px 18px;flex-shrink:0;}
.rp-head-l{display:flex;align-items:center;gap:10px;}
.rp-head-ic{width:32px;height:32px;background:linear-gradient(135deg,#4f8ef7,#00d4aa);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;}
.rp-brand-r{font-size:14px;font-weight:900;}
.rp-brand-r small{display:block;font-size:10px;opacity:.75;font-weight:500;margin-top:1px;}
.rp-head-r{text-align:right;font-size:11px;opacity:.9;line-height:1.6;}
.rp-ubar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#f0f4ff;border-bottom:2px solid #0d47a1;flex-shrink:0;}
.rp-uname{font-size:24px;font-weight:900;color:#0d47a1;}
.rp-umeta{font-size:14px;color:#444;font-weight:700;}
.rp-photos{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden;}
.rp-photos.has-sp{flex:0 0 66%;}
.rp-col{display:flex;flex-direction:column;padding:12px 14px;overflow:hidden;}
.rp-col+.rp-col{border-left:1px solid #e8ecf8;}
.rp-clbl{font-size:18px;font-weight:900;padding:9px 16px;border-radius:7px;margin-bottom:10px;flex-shrink:0;text-align:center;letter-spacing:-.01em;}
.rp-lbl-b{background:#fff0ee;color:#c62828;border:2px solid #fecaca;}
.rp-lbl-a{background:#e8f5e9;color:#2e7d32;border:2px solid #bbf7d0;}
.rp-plist{display:flex;flex-direction:column;gap:6px;overflow:hidden;flex:1;height:100%;}
.rp-plist .rp-pitem{flex:1 1 0 !important;min-height:0;height:0;padding:0 !important;}
.rp-pitem{border-radius:7px;overflow:hidden;border:1px solid #e0e4f0;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:0;}
.rp-pitem img{width:100%;height:100%;object-fit:contain;display:block;}
.rp-pitem.rp-empty{background:#f5f5f5;border:1px dashed #e0e0e0;padding:0 !important;}
.rp-empty-ph{display:flex;align-items:center;justify-content:center;background:#f7f8fc;border-radius:6px;border:1.5px dashed #d0d5ea;flex:1;font-size:26px;color:#ccc;}

/* ── 특이사항 섹션 ── */
.rp-sp-sec{flex:0 0 34%;display:flex;flex-direction:column;border-top:2px solid #f0b429;background:#fffbf0;overflow:hidden;}
.rp-sp-titlebar{background:linear-gradient(90deg,#f0b429,#e69400);color:#fff;padding:7px 18px;font-size:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.rp-sp-titlebar .ic{display:inline-flex;align-items:center;gap:6px;}
.rp-sp-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px;overflow:hidden;min-height:0;}
.rp-sp-grid .rp-pitem{height:100%;}
.rp-sp-text{flex-shrink:0;background:#fff;border-top:1px solid #f0d080;padding:10px 16px;font-size:13px;line-height:1.65;color:#333;max-height:110px;overflow:hidden;}
.rp-sp-text strong{color:#c07010;font-weight:800;font-size:12px;}
.rp-sp-text .extra-cnt{display:inline-block;float:right;font-size:11px;color:#c07010;background:rgba(240,180,41,.2);padding:2px 9px;border-radius:9px;font-weight:700;}

/* 특이사항 별도 페이지 */
/* 특이사항 2건 합치기 페이지 */
.rp-sp-paired{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}
/* 2건 한 페이지: 각 건이 상/하 절반씩 - 1건 레이아웃 재사용 */

  flex:1;
  min-height:0;
  border-bottom:none;
}
.rp-sp-divider{
  height:2px;
  flex-shrink:0;
  background:linear-gradient(to right, #f0b429, #ffe08a, #f0b429);
}
.rp-sp-small-row{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
  padding:8px 14px;
  background:#fffbf0;
}
.rp-sp-sm-label{
  font-size:11px;
  font-weight:700;
  color:#b07000;
  margin-bottom:6px;
  flex-shrink:0;
}
.rp-sp-sm-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  flex:1;
  min-height:0;
  overflow:hidden;
}
.rp-sp-sm-photos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  overflow:hidden;
}
.rp-sp-sm-photo{
  background:#f5ead0;
  border-radius:4px;
  overflow:hidden;
}
.rp-sp-sm-photo img{
  width:100%;height:100%;object-fit:cover;
}
.rp-sp-sm-photo.rp-empty{
  border:1.5px dashed #e0c880;
  background:#fffff0;
}
.rp-sp-sm-memo{
  font-size:13px;
  line-height:1.7;
  color:#222;
  overflow:hidden;
  word-break:keep-all;
  white-space:pre-wrap;
}
.rp-sp-page{} /* 마커 */
.rp-sp-layout{
  display:grid;
  grid-template-columns:55% 45%;
  gap:0;
  overflow:hidden;
  min-height:0;
}
/* 단독 1건: 전체 높이 */
.rp-sp-layout:not(.rp-sp-half){
  flex:1;
}
/* 좌측: 사진 1열 세로 배치 */
.rp-sp-photos-col{
  display:flex;
  flex-direction:column;
  padding:12px 8px 12px 14px;
  background:#fffbf0;
  border-right:2px solid #f0d090;
  overflow:hidden;
  gap:6px;
}
.rp-sp-photo-label{
  font-size:11px;
  font-weight:700;
  color:#b07000;
  letter-spacing:.3px;
  flex-shrink:0;
}
.rp-sp-photo-grid{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
  min-height:0;
}
.rp-sp-photo-item{
  background:#f5ead0;
  border-radius:4px;
  overflow:hidden;
  flex:1;
  min-height:0;
}
.rp-sp-photo-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.rp-sp-photo-item.rp-empty{
  border:1.5px dashed #e0c880;
  background:#fffff0;
}
/* 우측: 메모 */
.rp-sp-memo-col{
  display:flex;
  flex-direction:column;
  padding:12px 14px 12px 16px;
  background:#fff;
  overflow:auto;
}
.rp-sp-memo-label{
  font-size:12px;
  font-weight:700;
  color:#b07000;
  margin-bottom:10px;
  padding-bottom:6px;
  border-bottom:1.5px solid #f0d090;
  letter-spacing:.3px;
  flex-shrink:0;
}
.rp-sp-memo-text{
  font-size:15px;
  line-height:1.9;
  color:#222;
  word-break:keep-all;
  word-wrap:break-word;
  white-space:pre-wrap;
  flex:1;
}

/* 기존 rp-sp */
.rp-sp{border-top:2px solid #f0b429;padding:9px 18px;background:#fffbf0;flex-shrink:0;}
.rp-sp-title{font-size:12px;font-weight:800;color:#c07010;margin-bottom:7px;}
.rp-sp-items{display:flex;flex-wrap:wrap;gap:8px;}
.rp-sp-item{background:#fff;border:1px solid #f0d080;border-radius:6px;padding:7px 10px;flex:1;min-width:170px;}
.rp-sp-desc{font-size:12px;line-height:1.65;margin-bottom:5px;color:#333;}
.rp-sp-phs{display:flex;gap:5px;flex-wrap:wrap;}
.rp-sp-phs img{height:60px;width:auto;border-radius:4px;object-fit:contain;border:1px solid #e8d0a0;}
.rp-foot{padding:6px 18px;display:flex;justify-content:space-between;font-size:10px;color:#888;border-top:1px solid #eee;background:#fff;flex-shrink:0;}
.tok{color:#2e7d32;font-weight:700;}.twn{color:#e65100;font-weight:700;}
.sign-ln{display:inline-block;width:80px;border-bottom:1px solid #aaa;margin-left:4px;}

/* ── 회사정보 설정 모달 ── */
.co-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.co-modal.open{display:flex;}
.co-box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:480px;max-height:90vh;min-height:70vh;display:flex;flex-direction:column;overflow:hidden;}
@media (max-height:700px){.co-box{max-height:95vh;min-height:80vh;}}

/* 설정 모달은 더 크게 */
#settingsModal .co-box{max-width:520px;min-height:85vh;}

/* 테마 팝업 - 설정 모달 위에 표시 + 충분한 크기 */
#themePickerModal{z-index:1100 !important;padding:8px !important;}
#themePickerModal .co-box{
  min-height:80vh !important;
  height:80vh !important;
  max-height:95vh;
  width:96vw !important;
  max-width:560px !important;
}
#themePickerModal .co-body{padding:16px !important;}
/* 테마 팝업 안 그리드 - 큰 미리보기 */
#themePickerModal .theme-picker-grid{
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
}
#themePickerModal .theme-pick-prev{
  height:80px !important;
}
.co-head{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.co-head-title{font-size:15px;font-weight:700;}
.co-body{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1 1 0;min-height:0;-webkit-overflow-scrolling:touch;}
.co-field{display:flex;flex-direction:column;gap:5px;}
.co-field label{font-size:11px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:6px;}
.co-field label .co-tag{font-size:9px;background:rgba(61,142,240,.15);color:var(--ac);padding:1px 6px;border-radius:3px;font-weight:500;}
.co-input{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:inherit;font-size:14px;width:100%;transition:border-color .15s;}
.co-input:focus{outline:none;border-color:var(--ac);}
.co-input::placeholder{color:var(--mu);}
.co-textarea{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;color:var(--tx);font-family:inherit;font-size:13px;width:100%;resize:vertical;min-height:72px;transition:border-color .15s;}
.co-textarea:focus{outline:none;border-color:var(--ac);}
.co-textarea::placeholder{color:var(--mu);}
.co-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.co-divider{border:none;border-top:1px solid var(--bd);margin:4px 0;}
.co-preview-label{font-size:10px;color:var(--mu);font-weight:600;margin-bottom:6px;}
.co-preview{background:linear-gradient(135deg,#0a2a6e,#0d47a1);border-radius:10px;padding:14px 16px;color:#fff;}
.co-preview-name{font-size:15px;font-weight:900;margin-bottom:3px;}
.co-preview-sub{font-size:10px;opacity:.7;margin-bottom:7px;}
.co-preview-desc{font-size:10px;opacity:.75;line-height:1.8;border-left:2px solid rgba(255,255,255,.3);padding-left:8px;}
.co-foot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}

/* 아이콘 선택 영역 */
.co-icon-preview-row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;}
.co-icon-preview{width:54px;height:54px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden;}
.co-icon-preview img{width:100%;height:100%;object-fit:cover;}
.co-icon-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.co-icon-info-tx{font-size:12px;color:var(--tx);font-weight:600;}
.co-icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.co-icon-pick{aspect-ratio:1;background:var(--sf2);border:1.5px solid var(--bd);border-radius:8px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;color:var(--tx);position:relative;overflow:hidden;touch-action:manipulation;padding:0;}
.co-icon-pick:hover,.co-icon-pick:active{border-color:var(--ac);transform:scale(1.05);}
.co-icon-pick.active{border-color:var(--ac);background:rgba(61,142,240,.15);}
.co-icon-upload{background:linear-gradient(135deg,#f0832a,#e05c10);border-color:transparent;color:#fff;}
/* 헤더 업체정보 버튼 */
.co-hdr-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:5px 10px;color:var(--mu);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;touch-action:manipulation;}
.co-hdr-btn:hover,.co-hdr-btn:active{border-color:var(--ac);color:var(--ac);}
.co-hdr-btn.set{border-color:rgba(0,201,167,.4);color:var(--ac2);background:rgba(0,201,167,.08);}
/* 기존 인라인 cmp-sec 숨김 */
.cmp-sec{display:none !important;}

/* ═══════════════════════════════
   설정 모달
═══════════════════════════════ */
.set-sec{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--bd);}
/* ★ 설정 큰 메뉴(아코디언) */
/* .co-body가 flex column이라 flex-shrink 기본값(1) 때문에
   한 그룹을 펼치면 다른 그룹 헤더가 눌려 찌그러지고 내용이 잘리던 문제 →
   그룹은 절대 줄어들지 않게 하고, 스크롤은 .co-body가 담당 */
.set-group{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--sf);flex-shrink:0;}
.set-group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;cursor:pointer;background:var(--sf2);-webkit-tap-highlight-color:transparent;}
.set-group-arrow{font-size:14px;color:var(--mu);transition:transform .15s ease;flex-shrink:0;}
.set-group.open .set-group-arrow{transform:rotate(90deg);}
.set-group-body{display:none;padding:14px 14px 2px;}
.set-group.open .set-group-body{display:block;}
.set-group .set-sec:last-child{border-bottom:none;}
/* ★ 2026-08-17 설정 2단 아코디언 — 큰 타이틀 안의 소타이틀 */
.set-sub{border-top:1px solid var(--bd);}
.set-sub:first-child{border-top:none;}
.set-sub-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.set-sub-label{font-size:13px;font-weight:700;color:var(--tx);min-width:0;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.set-sub-arrow{font-size:12px;color:var(--mu);transition:transform .15s ease;flex-shrink:0;}
.set-sub.open .set-sub-arrow{transform:rotate(90deg);}
.set-sub-body{display:none;padding:2px 0 10px;}
.set-sub.open .set-sub-body{display:block;}
.set-sub .set-sec{border:none;padding:0;margin:0 0 4px;}
.set-sec:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.set-sec-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:10px;letter-spacing:-.01em;}

/* 테마 선택 */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.theme-btn{background:var(--sf2);border:2px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--tx);font-size:13px;font-weight:600;transition:border-color .2s,transform .1s;}
.theme-btn:active{transform:scale(.97);}
.theme-btn.active{border-color:var(--ac);background:var(--brand-soft);}
.theme-preview{width:34px;height:34px;border-radius:8px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.2);}

/* 글자 크기 */
.fs-control{display:flex;align-items:center;gap:10px;}
.fs-preview{flex:1;text-align:center;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px;font-weight:700;color:var(--tx);}

/* 라이트 테마 전용 보정 */
[data-theme="light"] .theme-btn.active{background:rgba(59,130,246,.12);}
[data-theme="light"] .btn.b-ghost{color:var(--tx);border-color:var(--bd);}
[data-theme="deepteal"] .btn.b-ghost{color:var(--tx);border-color:var(--bd);}
[data-theme="deepteal"] .theme-btn.active{background:rgba(15,95,107,.12);}
.unit,.unit-hd{background:var(--sf);}

/* ═══════════════════════════════════════════════
   테마 선택 팝업
═══════════════════════════════════════════════ */
.theme-picker-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
}
.theme-pick-item{
  background:var(--sf2);
  border:2px solid var(--bd);
  border-radius:12px;
  padding:10px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:all .15s;
}
.theme-pick-item:active{transform:scale(.97);}
.theme-pick-item.active{
  border-color:var(--ac);
  background:var(--sf3);
  box-shadow:0 0 0 1px var(--ac) inset;
}
.theme-pick-prev{
  width:100%;
  height:60px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
}
.theme-pick-lbl{
  font-size:13px;
  font-weight:600;
  color:var(--tx);
}
